# Kubernetes Job — the ML pipeline as a finite, run-to-completion batch workload.
#
# Why a Job and not a Deployment: the pipeline (`dvc repro`: preprocess → split →
# train → evaluate) runs to completion and exits. It has no request/response
# surface and nothing to keep alive, so a Deployment (which restarts a "healthy"
# process forever) would report its natural, successful exit as a crash-loop. The
# full rationale, completion/retry semantics, and the rejected alternatives are in
# docs/decisions/ADR-009-kubernetes-workload-model.md.
#
# SCOPE (Sprint 5, PR 2 — the runnable batch workload). This manifest is the
# actual workload: the real, locally built image and the real container command
# (`dvc repro`, the image's default CMD), with a lifecycle appropriate for a
# finite ML run. It deliberately does NOT yet include the following — each lands
# in a later, focused PR so the reasoning stays reviewable:
#   * ConfigMap / Secret / env wiring for data + MLflow credentials  (PR 3)
#   * securityContext hardening (runAsNonRoot, drop caps, seccomp, ...)  (PR 4)
#   * CPU/memory resource requests & limits                            (PR 5)
#   * a dedicated least-privilege ServiceAccount                       (PR 3)
# Consequently a *green* end-to-end run needs PR 3's data/credential wiring: the
# runtime image excludes data (.dockerignore) and expects it mounted, so without
# it the pipeline fails fast at the preprocess stage. See
# docs/kubernetes-architecture.md § "Local validation vs production-deferred".
apiVersion: batch/v1
kind: Job
metadata:
  name: mlops-pipeline
  namespace: mlops
  labels:
    app.kubernetes.io/name: mlops-pipeline
    app.kubernetes.io/part-of: mlops-pipeline
    app.kubernetes.io/component: batch-pipeline
    app.kubernetes.io/managed-by: kustomize
spec:
  # Completion/retry semantics (ADR-009). A finite Job completes once its single
  # pod exits 0. backoffLimit caps retries so a deterministic failure (bad data,
  # config error) fails fast instead of looping — it is NOT a service that should
  # be kept running.
  backoffLimit: 2
  # A wall-clock ceiling for the whole Job (all retries included). This is a
  # completion-semantics safety net, NOT a CPU/memory resource limit (those are
  # deferred to PR 5): the pipeline is a small, deterministic batch that finishes
  # in ~1–2 minutes locally, so a Job still running after 30 minutes is stuck
  # (e.g. a stalled network call to MLflow/DagsHub) and should fail with
  # DeadlineExceeded rather than occupy a pod indefinitely. Deliberately generous;
  # PR 5 may tighten it alongside resource tuning.
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlops-pipeline
        app.kubernetes.io/part-of: mlops-pipeline
        app.kubernetes.io/component: batch-pipeline
    spec:
      # Never: a failed pod is not restarted in place; the Job controller creates
      # a fresh pod for each retry (up to backoffLimit). This keeps every attempt
      # a clean run of the deterministic pipeline rather than a mutated container.
      restartPolicy: Never
      containers:
        - name: pipeline
          # The actual image the project builds. Name only here — the tag is
          # pinned per environment by an overlay (see overlays/local, which pins
          # `:local`, the tag produced by `docker build -t ml-pipeline:local .`
          # and by docker-compose). This repo has no image registry yet, so there
          # is no registry path to invent; publishing a versioned tag is a future
          # roadmap item and would be a new overlay, not a change to this base.
          # Base is always rendered through an overlay, never applied directly.
          image: ml-pipeline
          # Same entrypoint as the container image's default CMD; stated
          # explicitly so the workload's intent is legible in the manifest.
          command: ["dvc", "repro"]
