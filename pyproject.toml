[tool.mypy]
# Static type checking for the pipeline. Run with: python -m mypy
python_version = "3.12"
files = ["src"]

# Stages run as scripts with ``src/`` on ``sys.path`` and import siblings by
# their bare module name (``from exceptions import ...``). Mirroring that here
# lets mypy resolve those imports the same way the interpreter does at runtime.
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

# Strictness: require complete annotations and surface silent ``Any`` leaks,
# without resorting to per-line suppressions.
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
no_implicit_optional = true
strict_equality = true

# The ML, tracking, and config libraries below ship no type information (no
# bundled ``py.typed`` marker and no published stub packages). Ignoring their
# missing imports scopes "untyped" strictly to those third-party boundaries; it
# does not weaken checking of the pipeline's own code.
[[tool.mypy.overrides]]
module = [
    "mlflow.*",
    "sklearn.*",
    "dagshub.*",
    "dvc.*",
    "pandas",
    "pandas.*",
    "yaml",
]
ignore_missing_imports = true
