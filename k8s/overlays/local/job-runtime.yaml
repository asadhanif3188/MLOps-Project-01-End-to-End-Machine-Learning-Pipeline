# Local-overlay runtime patch (Sprint 5, PR 8; updated Sprint 7, PR 6).
#
# The BASE Job is environment-independent: it mounts only the DVC no-SCM config
# (needed in every environment) and reads MLFLOW_TRACKING_URI from the base
# ConfigMap. This patch layers the one thing still specific to a LOCAL run:
#
#   The runtime DATASET, mounted read-only at /app/data/raw from a ConfigMap the
#   operator creates OUT-OF-BAND from the local, git-ignored dataset file — exactly
#   like the credential Secret. The dataset is therefore never committed and never
#   baked into the image. `optional: true` means the Job still applies (and starts)
#   when the dataset ConfigMap is absent; the pipeline then fails fast at the
#   preprocess stage with a clear DataError ("Dataset not found:
#   'data/raw/data.csv'"), the intended graceful missing-input failure mode
#   (see the failure test in ADR-013).
#
#   >> This is a LOCAL VALIDATION mechanism and is NOT presented as production
#   >> storage. A ConfigMap caps at 1 MiB and is the wrong carrier for a real
#   >> dataset; production would use a PVC / object store / `dvc pull` from the
#   >> DVC remote.
#
# MLflow (Sprint 7, PR 6 — ADR-026): the former in-pod FILE-STORE override is
# REMOVED. The base ConfigMap now points MLFLOW_TRACKING_URI at the PERSISTENT
# in-cluster MLflow Tracking Server Service (PostgreSQL + MinIO/S3), so a local run
# logs to the REAL platform — the same tracking path exercised on AWS, differing
# only in the server's artifact backend. There is nothing MLflow-specific left to
# patch here: the pipeline needs no MLflow credentials (internal server, no client
# auth) and no S3 access (artifacts are proxied through the server).
apiVersion: batch/v1
kind: Job
metadata:
  name: mlops-pipeline
  namespace: mlops
spec:
  template:
    spec:
      containers:
        - name: pipeline
          # Appended to the base container's volumeMounts (merge key: mountPath).
          volumeMounts:
            - name: dataset
              mountPath: /app/data/raw
              readOnly: true
      # Appended to the base pod's volumes (merge key: name).
      volumes:
        - name: dataset
          configMap:
            name: mlops-pipeline-dataset
            # Apply/start succeed even before the dataset ConfigMap exists; the
            # pipeline then fails fast at preprocess (missing input) rather than
            # the pod being stuck unschedulable.
            optional: true
