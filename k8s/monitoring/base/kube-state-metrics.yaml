# kube-state-metrics (KSM) — the source of Kubernetes API-object state metrics
# (Sprint 8, PR 2). This is the component that makes the ephemeral pipeline Job
# observable: KSM is a long-running Deployment that watches the Kubernetes API and
# exposes the *state of API objects* (`kube_job_status_succeeded`,
# `kube_pod_container_status_last_terminated_reason`, `kube_node_status_condition`,
# …) as Prometheus metrics. Because it reflects the persistent `Job`/`Pod` objects
# — not the exited process — the pipeline Job's success/duration/OOM signals stay
# scrapable after the pod is gone (the queryability contract, ADR-028 § 3 and
# k8s/base/job.yaml `ttlSecondsAfterFinished`).
#
# Least privilege: KSM genuinely needs the Kubernetes API, so — unlike the mlops
# workloads — its ServiceAccount token IS mounted. It is granted a READ-ONLY
# ClusterRole (list/watch only, no get/create/update/patch/delete) scoped to
# exactly the object kinds whose metrics this project's four-layer model uses
# (docs/observability.md § 3). Kinds we do not surface (secrets, HPAs,
# networkpolicies, …) are deliberately omitted so KSM can never read them. This is
# the documented, scoped RBAC exception ADR-028 § 4 anticipated.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: monitoring
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: mlops-pipeline
    app.kubernetes.io/component: exporter
    app.kubernetes.io/managed-by: kustomize
# KSM calls the Kubernetes API, so it needs its token — this is the deliberate
# exception to the fleet-wide automount-off rule (ADR-028 § 4). The permissions
# that token carries are strictly read-only and scoped by the ClusterRole below.
automountServiceAccountToken: true
---
# Read-only ClusterRole. Cluster-scoped (not a namespaced Role) because KSM must
# see objects across ALL namespaces to report node/cluster state and the `mlops`
# workloads from the `monitoring` namespace. Every rule is list+watch ONLY — KSM
# never mutates anything and never even needs `get`. The resource list is trimmed
# to the kinds behind the documented Layer 1–4 signals; nothing else is readable.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: mlops-pipeline
    app.kubernetes.io/component: exporter
    app.kubernetes.io/managed-by: kustomize
rules:
  # Core objects behind Layer 1 (nodes, pods, PVCs, namespaces) and Layer 3/4
  # (services/endpoints readiness). Secrets are deliberately EXCLUDED.
  - apiGroups: [""]
    resources:
      - nodes
      - pods
      - services
      - endpoints
      - namespaces
      - persistentvolumeclaims
      - persistentvolumes
    verbs: ["list", "watch"]
  # Workload controllers behind Layer 1/3/4 (Deployment=MLflow, StatefulSet=
  # Postgres, DaemonSet=node-exporter, ReplicaSet ownership).
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs: ["list", "watch"]
  # The batch objects behind Layer 2 — the whole point of KSM here.
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: mlops-pipeline
    app.kubernetes.io/component: exporter
    app.kubernetes.io/managed-by: kustomize
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: monitoring
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: mlops-pipeline
    app.kubernetes.io/component: exporter
    app.kubernetes.io/managed-by: kustomize
spec:
  # Single replica: KSM is a stateless reflector of API state; one replica is
  # right-sized for a single-operator validation cluster (matches the MLflow
  # server's sizing rationale, ADR-026). HA sharding is deliberate future work.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-state-metrics
        app.kubernetes.io/part-of: mlops-pipeline
        app.kubernetes.io/component: exporter
    spec:
      serviceAccountName: kube-state-metrics
      # KSM needs its API token (see the ServiceAccount above) — this is the
      # deliberate, scoped exception; the token is read-only via the ClusterRole.
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        # The image ships a numeric non-root user; state it explicitly so
        # runAsNonRoot admits without resolving a name (same rationale as the
        # pipeline Job, k8s/base/job.yaml).
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kube-state-metrics
          # Pinned, non-latest (validate.py requires an explicit tag). Pulled from
          # the Kubernetes registry; on EKS the private nodes reach it via the NAT
          # gateway (ADR-015), locally via the internet.
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.13.0
          args:
            # Serve metrics on :8080 and the self-/telemetry endpoint on :8081.
            - --port=8080
            - --telemetry-port=8081
            # Watch ONLY the object kinds this project's four-layer model uses —
            # the EXACT set granted by the read-only ClusterRole above. Without
            # this, KSM's default resource set also tries to list/watch secrets,
            # configmaps, ingresses, HPAs, webhooks, etc., which the ClusterRole
            # deliberately does not grant: those informers would 403 in a loop and
            # can stall readiness. Pinning --resources makes KSM's on-the-wire
            # behaviour match its RBAC exactly (least privilege in practice, not
            # just on paper) and keeps it to the metrics docs/observability.md § 3
            # actually consumes.
            - --resources=cronjobs,daemonsets,deployments,endpoints,jobs,namespaces,nodes,persistentvolumeclaims,persistentvolumes,pods,replicasets,services,statefulsets
          ports:
            - name: http-metrics
              containerPort: 8080
            - name: telemetry
              containerPort: 8081
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            # KSM writes nothing to its filesystem — lock the root FS read-only.
            # (The pipeline Job cannot do this because `dvc repro` writes in-tree,
            # ADR-010; KSM has no such constraint, so it exceeds that baseline.)
            readOnlyRootFilesystem: true
          # Conservative STARTING resources (KSM is light — it holds an informer
          # cache proportional to object count, tiny on this cluster). Requests/
          # limits are mandatory (requirement 5) and set here; they are tightened
          # from MEASURED usage in the runtime-evidence PR (PR 6), per ADR-028 § 5
          # — this PR deploys nothing, so nothing is measured yet.
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          # KSM exposes its own liveness/readiness on the metrics/telemetry ports.
          livenessProbe:
            httpGet:
              path: /livez
              port: http-metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: telemetry
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
# Metrics Service — the stable in-cluster endpoint Prometheus scrapes via
# endpoints service discovery (see prometheus-config.yaml). ClusterIP: KSM is
# internal-only, never exposed outside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: monitoring
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: mlops-pipeline
    app.kubernetes.io/component: exporter
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kube-state-metrics
  ports:
    - name: http-metrics
      port: 8080
      targetPort: http-metrics
    - name: telemetry
      port: 8081
      targetPort: telemetry
