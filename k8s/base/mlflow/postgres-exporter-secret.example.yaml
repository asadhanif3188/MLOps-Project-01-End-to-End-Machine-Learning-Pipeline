# =============================================================================
# SECRET TEMPLATE — EXAMPLE ONLY. SAFE TO COMMIT. CONTAINS NO REAL CREDENTIALS.
# =============================================================================
#
# This is a *template*, not an applied manifest. It documents the shape of the
# credential Secret the postgres-exporter (Layer 4 monitoring, ADR-031) expects.
# The values below are placeholders — NEVER put real credentials here or commit a
# filled-in copy.
#
# Like the DB credential Secret (secret.example.yaml), it is deliberately NOT
# listed in mlflow/kustomization.yaml, so `kustomize build` / `kubectl apply -k`
# never render or apply it. The real Secret is created out-of-band, so credentials
# never pass through git or a rendered manifest.
#
# ─────────────────────────────────────────────────────────────────────────────
# STEP 1 — create the DEDICATED, LEAST-PRIVILEGE monitoring role in PostgreSQL.
# The exporter must NOT reuse the `mlflow` application role. Create a role that can
# read ONLY Postgres' statistics views (via the built-in `pg_monitor` role — it
# grants pg_stat_*, pg_database size, etc., and NO table data and NO writes):
#
#   kubectl -n mlops exec -it statefulset/mlflow-postgres -- \
#     psql -U "$POSTGRES_USER" -d mlflow -v ON_ERROR_STOP=1 <<'SQL'
#     CREATE ROLE mlflow_exporter WITH LOGIN PASSWORD 'REPLACE_WITH_EXPORTER_PASSWORD';
#     GRANT pg_monitor TO mlflow_exporter;
#     -- Defence in depth: cap any monitoring query so a probe can never wedge the DB.
#     ALTER ROLE mlflow_exporter SET statement_timeout = '5s';
#   SQL
#
# (Rotation: `ALTER ROLE mlflow_exporter WITH PASSWORD '...'` and re-create the
# Secret in lock-step, exactly like the DB credential Secret.)
#
# ─────────────────────────────────────────────────────────────────────────────
# STEP 2 — create the Secret from those values (keys consumed by the exporter as
# DATA_SOURCE_USER / DATA_SOURCE_PASS; see postgres-exporter.yaml):
#
#   kubectl create secret generic mlflow-postgres-exporter-credentials \
#     --namespace mlops \
#     --from-literal=POSTGRES_EXPORTER_USER=mlflow_exporter \
#     --from-literal=POSTGRES_EXPORTER_PASSWORD='REPLACE_WITH_EXPORTER_PASSWORD'
#
# The connection TARGET (host/port/db) is non-secret and lives in the exporter's
# DATA_SOURCE_URI env (postgres-exporter.yaml), not here.
apiVersion: v1
kind: Secret
metadata:
  name: mlflow-postgres-exporter-credentials
  namespace: mlops
  labels:
    app.kubernetes.io/name: postgres-exporter
    app.kubernetes.io/part-of: mlops-pipeline
    app.kubernetes.io/component: exporter
type: Opaque
stringData:
  # Placeholders — replace out-of-band (see the header). DO NOT COMMIT REAL VALUES.
  POSTGRES_EXPORTER_USER: "REPLACE_WITH_EXPORTER_USER"
  POSTGRES_EXPORTER_PASSWORD: "REPLACE_WITH_EXPORTER_PASSWORD"
