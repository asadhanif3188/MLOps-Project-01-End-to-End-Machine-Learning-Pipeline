# Kubernetes Job — the ML pipeline as a finite, run-to-completion batch workload.
#
# Why a Job and not a Deployment: the pipeline (`dvc repro`: preprocess → split →
# train → evaluate) runs to completion and exits. It has no request/response
# surface and nothing to keep alive, so a Deployment (which restarts a "healthy"
# process forever) would report its natural, successful exit as a crash-loop. The
# full rationale, completion/retry semantics, and the rejected alternatives are in
# docs/decisions/ADR-009-kubernetes-workload-model.md.
#
# SCOPE (Sprint 5). PR 2 made this the actual runnable workload: the real,
# locally built image and the real container command (`dvc repro`, the image's
# default CMD), with a lifecycle appropriate for a finite ML run. PR 3 added
# externalized configuration and a least-privilege identity (ConfigMap, an
# out-of-band Secret, a dedicated ServiceAccount with the API token automount
# off). PR 4 hardens the runtime with a securityContext:
#   * pod level      — runAsNonRoot + explicit runAsUser/runAsGroup 10001 (the
#     image's USER is the NAME `appuser`, which the kubelet cannot verify as
#     non-root; a numeric UID is required for runAsNonRoot to admit), and
#     seccompProfile RuntimeDefault.
#   * container level — allowPrivilegeEscalation: false and capabilities drop ALL
#     (the pipeline needs no Linux capabilities), plus an EXPLICIT
#     readOnlyRootFilesystem: false with the reason inline below.
# PR 5 (this change) adds resource & lifecycle management: CPU/memory requests
# and limits chosen from MEASURED usage of the real image (not guessed), plus
# documentation of the already-present finite-run lifecycle (restartPolicy,
# backoffLimit, activeDeadlineSeconds) and the deliberate absence of health
# probes. Rationale and the measurements are in
# docs/decisions/ADR-011-kubernetes-resource-lifecycle.md.
# PR 6 added CI manifest validation; PR 7 the operations runbook & proof.
# PR 8 (Kubernetes Runtime Execution) closes the last proof gap and makes a
# *green* end-to-end run real. It resolves the two blockers this header used to
# describe as open:
#   * SCM — `dvc repro` aborted with "/app is not a git repository". Fixed by
#     mounting `/app/.dvc/config.local` with `core.no_scm = true` (DVC's supported
#     no-SCM mode), sourced from the base `mlops-pipeline-dvc-config` ConfigMap.
#   * Dataset — the runtime image excludes data via `.dockerignore`. Originally the
#     local/AWS overlays mounted it read-only at `/app/data/raw` from a ConfigMap
#     generated out of the (git-ignored) dataset file. Sprint 7 PR 8 (ADR-027)
#     REPLACED that: an init container now retrieves the dataset at runtime from S3
#     into a shared emptyDir (see initContainers.fetch-dataset below). No ConfigMap,
#     no baked-in data, no hostPath.
# Sprint 7 PR 6 (ADR-026) rewired MLflow: the base ConfigMap now points
# MLFLOW_TRACKING_URI at the PERSISTENT in-cluster MLflow Tracking Server Service
# (PostgreSQL + S3 backend), replacing the removed DagsHub SaaS and the local
# overlay's in-pod file store. The pipeline needs no MLflow credentials (the
# server is internal-only, no client auth) and no S3 access (artifacts are proxied
# through the server), so the former credential Secret ref is gone. Verified end
# to end on Docker Desktop Kubernetes (Job Completed, exit 0, all four stages).
# Runtime contract design of record: ADR-013. Security
# rationale and the read-only-root decision remain in
# docs/decisions/ADR-010-kubernetes-security-hardening.md; see also
# docs/kubernetes-architecture.md § "Identity & security boundary".
apiVersion: batch/v1
kind: Job
metadata:
  name: mlops-pipeline
  namespace: mlops
  labels:
    app.kubernetes.io/name: mlops-pipeline
    app.kubernetes.io/part-of: mlops-pipeline
    app.kubernetes.io/component: batch-pipeline
    app.kubernetes.io/managed-by: kustomize
spec:
  # Completion/retry semantics (ADR-009; reviewed in PR 5, ADR-011). A finite Job
  # completes once its single pod exits 0. backoffLimit caps retries so a
  # deterministic failure (bad data, config error) fails fast instead of looping
  # — it is NOT a service that should be kept running. Kept at 2 deliberately:
  # this pipeline is deterministic, so a genuine code/data/config error will fail
  # identically on every attempt; the two retries exist only to absorb a
  # *transient* fault (a blip reaching the MLflow server), not to paper over a real
  # bug. Between attempts the Job controller applies an exponential back-off
  # (~10s, 20s, …), so a fast-failing pod cannot hot-loop.
  backoffLimit: 2
  # A wall-clock ceiling for the whole Job (all retries included). This is a
  # completion-semantics safety net, NOT a resource limit (CPU/memory limits are
  # set per-container below): the pipeline is a small, deterministic batch that
  # finishes in well under a minute of compute locally (train, the heaviest
  # stage, measured at ~2.5 s under a 1-CPU limit — see ADR-011), so a Job still
  # running after 30 minutes is stuck (e.g. a stalled network call to
  # the MLflow server) and should fail with DeadlineExceeded rather than occupy a pod
  # indefinitely. Deliberately generous — it is an outer stall-guard, not a
  # performance SLO; tightening it toward the real runtime would risk killing a
  # legitimately slow-but-progressing run on a constrained node.
  activeDeadlineSeconds: 1800
  # Retain the FINISHED Job (and its pod) for one hour after completion, then let
  # the Job controller auto-delete it. This honours the observability "queryability
  # contract" (ADR-028 § 3, docs/observability.md § 4): the pipeline pod exits in
  # under a minute, but kube-state-metrics reflects the persistent `Job`/`Pod`
  # OBJECT, so `kube_job_status_succeeded/_failed/_completion_time` and the pod's
  # `last_terminated_reason` (OOMKilled) stay scrapable ONLY while the finished Job
  # object exists. 3600s comfortably outlives many 30s Prometheus scrape intervals
  # (the scrape config in k8s/monitoring/base/prometheus-config.yaml), so the
  # last-run gauges remain live for an ample post-completion evidence read; once
  # Prometheus has scraped them, the samples persist in its TSDB for the whole
  # retention window regardless. The value is a deliberate balance, not a default:
  #   * long ENOUGH that the terminal state cannot vanish before a scrape (a tiny
  #     TTL would lose history);
  #   * bounded, so finished Jobs auto-reap instead of accumulating.
  # Re-run tension (called out in docs/observability.md § 4): the Job has a fixed
  # metadata.name, so re-submitting the SAME-named Job within the hour still needs
  # the finished one deleted first (`kubectl delete job mlops-pipeline`). Already-
  # scraped samples survive that delete in the TSDB; only the live "last-run" gauge
  # then tracks the newest Job. Moving to `generateName` / delete-before-recreate is
  # a deferred option, recorded — not silently adopted — in ADR-029.
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlops-pipeline
        app.kubernetes.io/part-of: mlops-pipeline
        app.kubernetes.io/component: batch-pipeline
    spec:
      # Never: a failed pod is not restarted in place; the Job controller creates
      # a fresh pod for each retry (up to backoffLimit). This keeps every attempt
      # a clean run of the deterministic pipeline rather than a mutated container.
      # (For a Job, restartPolicy must be Never or OnFailure; Never is chosen so
      # each retry is a brand-new pod whose logs/events are inspectable
      # independently, rather than an in-place container restart that overwrites
      # the previous attempt's state — see ADR-011.)
      #
      # No health probes (liveness/readiness/startup) are defined, by design.
      # Probes model a long-running server: readiness gates traffic to a Service,
      # liveness restarts a wedged daemon. This workload is a finite batch Job with
      # no listening socket, no Service, and no request traffic — "healthy" is not a
      # steady state to poll but a terminal one: exit 0 = success, non-zero =
      # failure, which the Job controller already observes directly. A liveness
      # probe here would either need an HTTP endpoint the app does not (and should
      # not) expose, or would fire on the pipeline's normal quiet compute and kill a
      # healthy run. The pipeline's true health signal is its exit status plus its
      # structured logs; probes would add machinery without a health question to
      # answer. Rationale recorded in ADR-011.
      restartPolicy: Never
      # Run under the workload's own least-privilege identity (serviceaccount.yaml)
      # instead of the namespace `default` account.
      serviceAccountName: mlops-pipeline
      # The pipeline never calls the Kubernetes API (it runs dvc/sklearn/MLflow),
      # so it needs no API token. Re-asserted here at the pod level even though the
      # ServiceAccount already defaults it off — defense in depth, and it makes the
      # workload's "no cluster API access" intent explicit in the Job itself.
      automountServiceAccountToken: false
      # Pod-level security context (PR 4). Applies to every container in the pod.
      securityContext:
        # Refuse to start if the resolved user is root (uid 0). The image already
        # drops to `appuser` via `USER appuser`, but that USER is a NAME; the
        # kubelet cannot resolve a name to a uid at admission, so runAsNonRoot
        # alone would fail with CreateContainerConfigError ("container has
        # runAsNonRoot and image has non-numeric user"). The explicit numeric
        # runAsUser/runAsGroup below is therefore REQUIRED, not cosmetic.
        runAsNonRoot: true
        # Match the Dockerfile's dedicated identity exactly (groupadd/useradd
        # --uid 10001 --gid 10001). Stating it here means the pod's identity is
        # legible in the manifest and independent of the image's USER directive.
        runAsUser: 10001
        runAsGroup: 10001
        # Apply the container runtime's default seccomp profile (blocks the
        # dangerous/obsolete syscalls) instead of running seccomp-unconfined.
        # Required by the restricted Pod Security Standard.
        seccompProfile:
          type: RuntimeDefault
        # Own mounted volumes as gid 10001 (Sprint 7, PR 8). The `fetch-dataset`
        # init container writes the downloaded dataset into the shared `dataset`
        # emptyDir; an emptyDir is created root-owned, so a non-root process (uid
        # 10001) could not write to it without this. fsGroup makes the kubelet
        # group-own + setgid the mounted volumes to 10001 (the container's group),
        # so the init container can populate the dataset and the pipeline container
        # can read it — all still as the unprivileged user, root nowhere.
        fsGroup: 10001
      # Readiness gate on the tracking platform (Sprint 7, PR 6 — ADR-026). The
      # pipeline logs to the in-cluster MLflow server; if it starts before the
      # server is Ready, the `train` stage's tracking call fails and the Job burns a
      # retry. This init container BLOCKS the pipeline container until MLflow's
      # /health returns 200, turning a race into a deterministic wait. It uses the
      # SAME pipeline image (so the overlay's image pin rewrites it too) and needs no
      # extra tooling — just Python's stdlib. /health is exempt from MLflow's host
      # validation, so the FQDN works with no allow-list dependency. If MLflow never
      # becomes Ready it exits non-zero after ~5 min, failing the Job cleanly (which
      # then retries per backoffLimit) rather than hanging.
      initContainers:
        # Dataset retrieval (Sprint 7, PR 8 — closes finding M-04). Runs BEFORE the
        # pipeline (and before the MLflow wait, so a data problem fails fast rather
        # than after a 5-minute readiness wait). It downloads the raw dataset from
        # S3 (real Amazon S3 on EKS via Pod Identity; the S3-compatible MinIO
        # locally) into the shared `dataset` emptyDir mounted at /app/data/raw, which
        # the pipeline container then reads. This REPLACES the former ConfigMap
        # dataset-delivery mechanism: the dataset is no longer baked into the image,
        # committed to Git, or carried in a ConfigMap. Retrieval is env-INDEPENDENT
        # (S3 API everywhere), so it lives in the BASE; only the SOURCE (bucket URI,
        # endpoint, credentials) is env-specific and supplied by the overlays.
        # Uses the SAME pipeline image (the overlay's image pin rewrites it too) and
        # runs first-party Python (src/fetch_dataset.py) so the download is
        # unit-tested, typed, and verifies the bytes against DATASET_SHA256 —
        # failing the Job cleanly on a missing object, denied access, or checksum
        # mismatch. Rationale: ADR-027.
        - name: fetch-dataset
          image: ml-pipeline
          command: ["python", "src/fetch_dataset.py"]
          # DATASET_SHA256 (the pinned dataset identity/version) and LOG_LEVEL come
          # from the base ConfigMap; the env-specific DATASET_S3_URI / endpoint /
          # region (and, locally, the MinIO credential Secret) are layered by the
          # overlays onto this same-named init container.
          envFrom:
            - configMapRef:
                name: mlops-pipeline-config
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          # Writable mount of the shared dataset volume — this container POPULATES
          # it (writable, so no readOnly here); the pipeline container mounts the
          # same volume read-only.
          volumeMounts:
            - name: dataset
              mountPath: /app/data/raw
        - name: wait-for-mlflow
          image: ml-pipeline
          command: ["python", "-c"]
          args:
            - |
              import os, sys, time, urllib.request
              url = os.environ.get("MLFLOW_TRACKING_URI", "").rstrip("/") + "/health"
              attempts = 60
              for i in range(attempts):
                  try:
                      with urllib.request.urlopen(url, timeout=3) as r:
                          if r.status == 200:
                              print(f"MLflow ready at {url}")
                              sys.exit(0)
                  except Exception as e:  # any failure just means "not ready yet"
                      print(f"[{i + 1}/{attempts}] waiting for MLflow at {url}: {e}")
                  time.sleep(5)
              print(f"MLflow not ready after {attempts * 5}s", file=sys.stderr)
              sys.exit(1)
          # MLFLOW_TRACKING_URI comes from the same ConfigMap the pipeline reads.
          envFrom:
            - configMapRef:
                name: mlops-pipeline-config
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
      containers:
        - name: pipeline
          # The actual image the project builds. Name only here — the tag is
          # pinned per environment by an overlay (see overlays/local, which pins
          # `:local`, the tag produced by `docker build -t ml-pipeline:local .`
          # and by docker-compose). This repo has no image registry yet, so there
          # is no registry path to invent; publishing a versioned tag is a future
          # roadmap item and would be a new overlay, not a change to this base.
          # Base is always rendered through an overlay, never applied directly.
          image: ml-pipeline
          # Same entrypoint as the container image's default CMD; stated
          # explicitly so the workload's intent is legible in the manifest.
          command: ["dvc", "repro"]
          # Container-level security context (PR 4). These are container-scoped
          # fields (they cannot live in the pod securityContext).
          securityContext:
            # Forbid a process from gaining more privileges than its parent
            # (no setuid/setgid escalation). Verified: /proc/self/status reports
            # NoNewPrivs: 1 under this setting.
            allowPrivilegeEscalation: false
            # The pipeline shells out to nothing privileged — it runs Python
            # (sklearn/pandas/mlflow) and dvc over HTTPS. It needs no Linux
            # capabilities at all, so drop the entire default set.
            capabilities:
              drop:
                - ALL
            # DELIBERATELY false, and validated as the correct choice today — not
            # an oversight. `dvc repro` mutates DVC state IN-TREE at the /app repo
            # root: its first action under a read-only root FS is a write to
            # /app/.dvc/tmp (empirically: "[Errno 30] Read-only file system:
            # '/app/.dvc/tmp'"), and it further writes /app/.dvc/cache, updates
            # /app/dvc.lock, and requires a writable /app/.git for the SCM DVC
            # depends on — all at the repo root, interleaved with the baked-in,
            # read-only application code and .dvc/config. Those paths cannot be
            # carved out with emptyDir mounts without either shadowing the image's
            # own files or making the code root writable (which defeats the
            # control). Enabling readOnlyRootFilesystem now would introduce a NEW,
            # earlier failure than the pre-existing SCM blocker — i.e. weaken the
            # workload to satisfy a checkbox. It is deferred to the same work that
            # makes the pipeline green in-cluster (relocating DVC's cache/tmp/lock
            # and SCM onto declared writable volumes), tracked in
            # ADR-010-kubernetes-security-hardening.md § "Read-only root filesystem".
            readOnlyRootFilesystem: false
          # Resource requests & limits (PR 5). Chosen from MEASURED usage of the
          # real ml-pipeline:local image, not guessed — see ADR-011 for the probe
          # method and numbers. The heaviest stage is `train`
          # (RandomForest + GridSearchCV); the trivial stages (preprocess/split/
          # evaluate) sit far below these figures.
          #
          # Key measured fact: GridSearchCV runs with n_jobs=-1, and joblib/loky
          # reads the cgroup CPU quota (i.e. the CPU *limit*), NOT the node's core
          # count. So the CPU limit doubles as the memory-safety control: it caps
          # how many worker processes joblib forks, and each fork copies the
          # ~130 MiB interpreter. Measured peak (whole cgroup, incl. workers):
          #   1 CPU  -> ~133 MiB, ~2.5 s   (chosen operating point: no fan-out)
          #   2 CPU  -> ~419 MiB, ~5.4 s
          #   unlim. -> ~1785 MiB, ~20 s   (20 host cores each fork a copy)
          # More cores actively HURT at this data size (fork/dispatch overhead
          # dwarfs the sub-second fits), so capping at 1 CPU is both leaner and
          # faster here. Validated: at these exact limits the run completes with a
          # ~133 MiB peak; at 64Mi it is OOMKilled (exit 137) — the limit is
          # kernel-enforced.
          resources:
            requests:
              # A scheduling reservation, not a hard need. 250m lets a short,
              # deterministic batch make steady progress (each grid fit is ~1 s on
              # one core); it is not so large that the Job is hard to schedule on a
              # busy node.
              cpu: 250m
              # Comfortably above the measured ~133 MiB import+train floor, so the
              # pod is guaranteed enough memory to run without relying on node
              # headroom (memory requests are a genuine reservation — the kernel
              # cannot reclaim an app's live pages).
              memory: 256Mi
            limits:
              # 1 full core. Bounds joblib's worker fan-out to a single worker
              # (loky reads this quota), which is what keeps memory ~133 MiB and
              # predictable. A CPU limit on a batch Job is safe: CFS throttling only
              # makes it marginally slower, and any slowdown is bounded by
              # activeDeadlineSeconds — unlike a latency-sensitive service, extra
              # wall-clock here is harmless.
              cpu: "1"
              # ~3.9x the measured 1-CPU peak (~133 MiB). Enough headroom for log
              # buffers and minor future grid growth, but tight enough that a real
              # runaway is OOMKilled instead of silently eating a node. (Requests
              # and limits differ deliberately: Burstable QoS — reserve a modest
              # floor, cap the ceiling.)
              memory: 512Mi
          # Runtime volume mounts. Two environment-INDEPENDENT inputs are mounted
          # here in the BASE: the DVC no-SCM config (no image ships `.git`, so every
          # environment needs it) and the raw dataset (Sprint 7, PR 8 — retrieved at
          # runtime by the fetch-dataset init container into a shared emptyDir, so
          # every environment gets it the same way). Only the dataset SOURCE and the
          # MLflow backend are environment-specific, and those are layered in the
          # overlays — the base no longer presumes the data arrives via a ConfigMap.
          volumeMounts:
            # DVC's local config override, mounted read-only BESIDE the image's
            # own /app/.dvc/config (subPath, so it does not shadow the directory).
            # It carries `core.no_scm = true`, which is what lets `dvc repro` run
            # without a Git repo in the image (was: "/app is not a git
            # repository"). DVC only reads this file; its writable state
            # (/app/.dvc/tmp, /app/.dvc/cache, /app/dvc.lock) is on the writable
            # root FS. Full rationale: dvc-config.yaml and ADR-013.
            - name: dvc-runtime-config
              mountPath: /app/.dvc/config.local
              subPath: config.local
              readOnly: true
            # The raw dataset, populated by the `fetch-dataset` init container and
            # read here as the preprocess stage's input (params.yaml:
            # preprocess.input = data/raw/data.csv). Mounted READ-ONLY: this
            # container only consumes the dataset; the init container is the sole
            # writer. Shared via an emptyDir (declared below) — no ConfigMap, no
            # hostPath. Sprint 7, PR 8 (ADR-027).
            - name: dataset
              mountPath: /app/data/raw
              readOnly: true
          # Externalized configuration (PR 3). The image stays immutable; env-var
          # config is injected from the cluster via the base ConfigMap:
          #   * configMapRef — non-secret config (LOG_LEVEL, MLFLOW_TRACKING_URI),
          #     always present (it is part of the Kustomize base).
          # The ConfigMap injects env vars whose names match exactly what the code
          # reads (require_env / logging_config / the MLflow client).
          #
          # No credential Secret is referenced any more (Sprint 7, PR 6 — ADR-026).
          # Tracking now targets the in-cluster MLflow Tracking Server, which runs
          # internal-only with no client authentication, so the pipeline needs no
          # MLFLOW_TRACKING_USERNAME/_PASSWORD. The former out-of-band DagsHub Secret
          # is gone. S3 artifact credentials live ONLY on the tracking server (via
          # its Secret locally, or EKS Pod Identity on AWS) — the pipeline uploads
          # artifacts through the server (`mlflow-artifacts:` proxy) and never holds
          # S3 access itself.
          envFrom:
            - configMapRef:
                name: mlops-pipeline-config
      # Pod-level volumes. Both are now environment-INDEPENDENT (Sprint 7, PR 8):
      #   * dvc-runtime-config — the DVC no-SCM config (every environment needs it).
      #   * dataset            — an emptyDir the `fetch-dataset` init container fills
      #     from S3 and the pipeline container reads. An emptyDir (pod-lifetime
      #     scratch space), NOT a ConfigMap and NOT a hostPath: the real dataset now
      #     arrives at RUNTIME from object storage over the S3 API, so the volume is
      #     just the hand-off buffer between the init and main containers. What
      #     differs per environment is only the dataset SOURCE (the S3 URI /
      #     endpoint / credentials), layered onto the init container by the overlays.
      volumes:
        - name: dvc-runtime-config
          configMap:
            name: mlops-pipeline-dvc-config
        - name: dataset
          emptyDir: {}
