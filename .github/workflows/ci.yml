# Continuous Integration for the End-to-End ML Pipeline.
#
# Quality gates that run on every push to `main` and every pull request. CI is
# validation ONLY: it lints, tests, builds the container image to prove it
# assembles and runs, and STATICALLY validates the Kubernetes manifests (YAML
# syntax, upstream schema, Kustomize rendering, and the workload's security
# contract). It does NOT deploy, does NOT push images to any registry, and does
# NOT run the workload on a cluster. The one job that touches a Kubernetes API
# server — `k8s-cluster-dry-run` — is opt-in (workflow_dispatch only) and does a
# server-side *dry run* that admits the manifests without persisting or executing
# them. Continuous *delivery* (an actual deploy) is deferred (see docs/ci-cd.md
# § "Future CD roadmap" and roadmap.md v3).
#
# Design of record: docs/ci-cd.md (§ "Kubernetes manifest validation").

name: CI

# Validate the integration target (main) and every change proposed against it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # allow manual runs from the Actions tab

# Least privilege: CI only needs to read the repository. No write/packages scope
# is granted, which structurally prevents this workflow from pushing anything.
permissions:
  contents: read

# One in-flight run per ref. A newer push/PR update cancels the superseded run so
# CI feedback tracks the latest commit and we don't burn minutes on stale work.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # quality — the fast feedback gate: lint + format + tests on the host runner.
  # Runs first; the image build below only starts if this passes.
  # ---------------------------------------------------------------------------
  quality:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      # Stage 1 — Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # Stage 2 — Setup Python (3.12, matching pyproject target-version / mypy).
      # setup-python caches the pip download cache keyed on the requirements files.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Stage 3 — Install dependencies. requirements-dev.txt starts with
      # `-r requirements.txt`, so this installs both the runtime stack and the
      # toolchain (Ruff, pytest) in one resolve.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Stage 4 — Ruff: lint, then verify formatting. `--output-format=github`
      # renders violations as inline PR annotations. Format is checked (never
      # rewritten) so CI reports drift without mutating the tree.
      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check .

      # Stage 5 — mypy: static type checking. Runs the SAME `python -m mypy` a
      # developer runs locally (via `make typecheck`) and pre-commit runs at commit
      # time — all three read the single `[tool.mypy]` config in pyproject.toml
      # (strict: disallow_untyped_defs, warn_return_any, warn_unused_ignores, …) and
      # its `files = ["src"]`. This makes the type contract a binding server-side
      # gate: a non-zero exit fails the job, so a type regression can no longer reach
      # `main` on green pre-commit alone. mypy is already installed by Stage 3
      # (requirements-dev.txt), so this adds no dependency install.
      - name: mypy type check
        run: python -m mypy

      # Stage 6 — Pytest. Configuration (pythonpath=src, testpaths=tests, strict
      # markers) lives in pyproject.toml, so a bare `pytest` runs exactly what a
      # developer runs locally via `make test`. This suite includes the
      # `contract`-marked tests (tests/contract/) that assert dvc.yaml <-> params.yaml
      # consistency, artifact ownership, and the declared lineage — the failing
      # gates for a broken stage contract or inconsistent configuration. They parse
      # files only: no data, no network, no credentials.
      - name: Pytest
        run: pytest

      # Stage 7 — DVC pipeline integrity. Validates the pipeline *definition* in
      # dvc.yaml WITHOUT running it: no stage executes, no dataset is pulled, and
      # the DagsHub remote is never contacted. `dvc` is already installed (it is a
      # runtime dependency in requirements.txt, pulled in via requirements-dev.txt
      # above), so this adds no extra install.
      #
      #   * `dvc dag`    — proves DVC parses every stage and builds an acyclic
      #                    graph; a malformed dvc.yaml or a cyclic graph fails here.
      #   * `dvc status` — LOCAL status only (never `--cloud`); proves the stage and
      #                    `.dvc` definitions parse coherently. It reports "changed"
      #                    because no dvc.lock is committed and the data lives on the
      #                    remote — that is expected and exits 0; a non-zero here
      #                    means a genuinely broken definition.
      #
      # `dvc repro --dry` is deliberately NOT used: it accesses the first stage's
      # data dependency (data/raw/data.csv), which is remote-only in CI, so it would
      # require `dvc pull` + DagsHub credentials or fail nondeterministically. The
      # structural guarantees it would give are instead enforced offline by the
      # `contract` tests above.
      #
      # DVC's anonymous usage analytics is disabled so this step makes NO network
      # call, keeping CI deterministic and offline (pipeline contract §9).
      - name: DVC pipeline integrity (graph + status, offline)
        env:
          DVC_NO_ANALYTICS: "true"
        run: |
          set -euo pipefail

          echo "::group::Graph is parseable and acyclic (dvc dag)"
          dvc dag
          echo "::endgroup::"

          # Render the DAG into the job summary for at-a-glance review (cosmetic).
          { echo "### DVC pipeline graph"; echo; dvc dag --md; } \
            >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

          echo "::group::Pipeline definition is coherent (dvc status, no remote)"
          dvc status
          echo "::endgroup::"

      # Stage 8 — Fixture pipeline reproduction. The step above validates the
      # production pipeline's *definition* but cannot run it (its raw data is
      # remote-only and its stages log to DagsHub MLflow). This step proves actual
      # `declared pipeline + params + inputs + code = reproducible execution` by
      # running a REAL `dvc repro` over the self-contained fixture pipeline
      # (tests/fixtures/pipeline/): the SAME src/ stage code against a small
      # committed fixture dataset, with the MLflow boundary stubbed offline by the
      # fixture wrapper (_run_stage.py). No remote, no MLflow server, no
      # credentials. See docs/pipeline-contract.md §7 and ADR-008.
      - name: Fixture pipeline reproduction (real dvc repro, offline)
        env:
          DVC_NO_ANALYTICS: "true"
        run: |
          set -euo pipefail
          FIXTURE=tests/fixtures/pipeline

          echo "::group::Reproduce the fixture pipeline end to end (dvc repro)"
          # Outputs are gitignored, so a fresh checkout runs all four stages for
          # real. A non-zero exit means the declared pipeline no longer executes.
          dvc repro "$FIXTURE/dvc.yaml"
          echo "::endgroup::"

          echo "::group::Reproduced workspace matches its lock (dvc status)"
          # After reproducing, the workspace must be coherent with the lock DVC
          # resolved for this run — the lock-state consistency guarantee.
          status="$(dvc status "$FIXTURE/dvc.yaml")"
          echo "$status"
          echo "$status" | grep -q "up to date" \
            || { echo "::error::fixture pipeline is not up to date after repro"; exit 1; }
          echo "::endgroup::"

          echo "::group::Reproduction is deterministic (force re-run, compare artifacts)"
          # Equal inputs + params + seed + code must yield equal outputs. Capture
          # the model and metrics hashes, force a full re-execution, and require
          # byte-identical artifacts. A mismatch means training is non-deterministic.
          model_1="$(md5sum "$FIXTURE/models/model.pkl" | awk '{print $1}')"
          metrics_1="$(md5sum "$FIXTURE/metrics/metrics.json" | awk '{print $1}')"
          dvc repro -f "$FIXTURE/dvc.yaml" >/dev/null
          model_2="$(md5sum "$FIXTURE/models/model.pkl" | awk '{print $1}')"
          metrics_2="$(md5sum "$FIXTURE/metrics/metrics.json" | awk '{print $1}')"
          echo "model  md5: $model_1 -> $model_2"
          echo "metrics md5: $metrics_1 -> $metrics_2"
          test "$model_1" = "$model_2" \
            || { echo "::error::model.pkl not reproducible across runs"; exit 1; }
          test "$metrics_1" = "$metrics_2" \
            || { echo "::error::metrics.json not reproducible across runs"; exit 1; }
          echo "::endgroup::"

  # ---------------------------------------------------------------------------
  # docker — build the production image and prove it runs. Gated on `quality`
  # (needs:) so we never spend build minutes on a change that fails lint/tests.
  # ---------------------------------------------------------------------------
  docker:
    name: Docker Build & Validate
    runs-on: ubuntu-latest
    needs: quality
    steps:
      # Stage 1 — Checkout (each job runs on a fresh runner).
      - name: Checkout
        uses: actions/checkout@v4

      # BuildKit builder — enables the Dockerfile's cache mounts and the gha
      # layer cache used below.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Stage 9 — Docker Build. Builds the `runtime` (production) target only.
      #   push: false  — never publish (no registry, no credentials in this job).
      #   load: true   — load the built image into the local daemon so the
      #                  validation step below can actually run it.
      # GitHub Actions cache (type=gha) persists layers between runs for speed.
      - name: Build image (runtime target — no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: ml-pipeline:ci
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_VERSION=ci-${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Stage 10 — Build validation. A build that produces an unusable image is a
      # failure, so assert the security and runtime contract of the shipped image:
      #   * it runs as the intended non-root user (UID 10001),
      #   * the core scientific/ML stack imports cleanly, and
      #   * the DVC entrypoint CLI is present.
      - name: Build validation
        run: |
          set -euo pipefail
          echo "::group::Non-root user (expect UID 10001)"
          uid="$(docker run --rm ml-pipeline:ci id -u)"
          echo "container UID = ${uid}"
          test "${uid}" = "10001"
          echo "::endgroup::"

          echo "::group::Core imports resolve"
          docker run --rm ml-pipeline:ci \
            python -c "import sklearn, mlflow, dvc, pandas; print('imports OK')"
          echo "::endgroup::"

          echo "::group::DVC entrypoint present"
          docker run --rm ml-pipeline:ci dvc --version
          echo "::endgroup::"

  # ---------------------------------------------------------------------------
  # k8s-validate — STATIC validation of the Kubernetes manifests. Independent of
  # `quality`/`docker` (no Python package or image needed), so it runs in
  # parallel for fast feedback. Deterministic: no cluster is contacted and the
  # workload is never run — this proves the manifests are well-formed, schema-
  # valid, render cleanly through Kustomize, and satisfy the security contract
  # from PRs 1-5. It does NOT prove the workload deploys or runs (that is the
  # opt-in k8s-cluster-dry-run job below). Tool + schema versions are pinned so a
  # green run today is a green run tomorrow. Design of record: docs/ci-cd.md
  # § "Kubernetes manifest validation".
  # ---------------------------------------------------------------------------
  k8s-validate:
    name: K8s Manifest Validation (static)
    runs-on: ubuntu-latest
    env:
      # Pinned for reproducibility. Bump deliberately, not implicitly.
      KUSTOMIZE_VERSION: 5.4.3
      KUBECONFORM_VERSION: 0.6.7
      # The Kubernetes API version whose OpenAPI schema the manifests are checked
      # against. Pinned so the schema gate is stable regardless of the manifests'
      # eventual target cluster version.
      K8S_SCHEMA_VERSION: 1.31.0
    steps:
      # Stage 1 — Checkout.
      - name: Checkout
        uses: actions/checkout@v4

      # Stage 2 — Python 3.12 for the project validator (k8s/validate.py). Only
      # PyYAML is needed; installing just that keeps the job lean and fast (no
      # sklearn/dvc/mlflow stack) — the validator is pure stdlib + PyYAML.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML (validator's only dependency)
        run: pip install "pyyaml==6.0.2"

      # Stage 3 — Install kustomize (pinned) and kubeconform (pinned) as single
      # static binaries, each verified against its release checksums before use
      # (integrity against a corrupted download). GitHub runners ship *some*
      # kustomize, but pinning makes the render deterministic across runner image
      # bumps. Pinning the binaries by digest is a future supply-chain hardening
      # step (roadmap / ADR-005), noted honestly rather than claimed here.
      - name: Install kustomize + kubeconform (pinned, checksum-verified)
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; cd "$tmp"

          echo "::group::kustomize v${KUSTOMIZE_VERSION}"
          base="https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}"
          # Download to the EXACT filename each checksums file references, so
          # `sha256sum -c -` (which reads the name from the checksum line) can find it.
          kustomize_tar="kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "${kustomize_tar}" "${base}/${kustomize_tar}"
          curl -fsSLo kustomize_checksums.txt "${base}/checksums.txt"
          grep "${kustomize_tar}" kustomize_checksums.txt | sha256sum -c -
          tar -xzf "${kustomize_tar}"
          sudo install -m 0755 kustomize /usr/local/bin/kustomize
          echo "::endgroup::"

          echo "::group::kubeconform v${KUBECONFORM_VERSION}"
          kcbase="https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}"
          kubeconform_tar="kubeconform-linux-amd64.tar.gz"
          curl -fsSLo "${kubeconform_tar}" "${kcbase}/${kubeconform_tar}"
          curl -fsSLo kubeconform_checksums.txt "${kcbase}/CHECKSUMS"
          grep "${kubeconform_tar}" kubeconform_checksums.txt | sha256sum -c -
          tar -xzf "${kubeconform_tar}"
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform
          echo "::endgroup::"

          kustomize version
          kubeconform -v

      # Stage 4 — Kustomize render + schema validation (kubeconform). Rendering
      # both base and overlay proves the Kustomize build is valid (and that the
      # YAML is syntactically sound); piping into kubeconform -strict validates
      # every object against the pinned upstream Kubernetes OpenAPI schema and
      # REJECTS unknown fields (a typo'd or misplaced field fails here).
      #   NOTE: kubeconform fetches the pinned schema from the public
      #   kubernetes-json-schema repo, so this step needs network. It is the only
      #   network dependency in this job; the rest is fully offline.
      - name: Render + schema validation (kustomize + kubeconform)
        run: |
          set -euo pipefail
          for target in k8s/base k8s/overlays/local k8s/overlays/aws; do
            echo "::group::kubeconform ${target} (k8s ${K8S_SCHEMA_VERSION}, strict)"
            kustomize build "${target}" \
              | kubeconform -strict -summary -verbose \
                  -kubernetes-version "${K8S_SCHEMA_VERSION}" \
                  -schema-location default -
            echo "::endgroup::"
          done

      # Stage 5 — Project security, required-field & runtime-contract checks.
      # Renders each overlay and asserts the workload contract that a generic
      # schema validator cannot express: runAsNonRoot, allowPrivilegeEscalation
      # false, seccomp RuntimeDefault, capabilities drop ALL, explicit non-default
      # ServiceAccount, token automount off, CPU/memory requests+limits, explicit
      # pinned image, namespace pinning, and secret hygiene (no rendered Secret, no
      # inline credentials). It ALSO asserts the PR 8 runtime-execution contract
      # (ADR-013): the DVC no-SCM ConfigMap + its read-only /app/.dvc/config.local
      # mount, the dataset mount at /app/data/raw backed by a declared volume, and a
      # configured MLFLOW_TRACKING_URI. This is STILL static — it proves the manifest
      # declares the contract, not that a run succeeds. Each check prints a PASS/FAIL
      # line, so a failure names exactly what is wrong.
      #
      # BOTH deployable overlays are checked: `local` (Sprint 5) and `aws` (the
      # Sprint 6 PR 5 EKS overlay). Running the same contract over the AWS overlay
      # proves its cloud-specific patch (ECR image, pull policy, dataset mount)
      # keeps every Sprint 5 security control intact — the overlay inherits them
      # from the base and weakens none.
      - name: Static security, required-field & runtime-contract checks (k8s/validate.py)
        run: |
          set -euo pipefail
          for overlay in k8s/overlays/local k8s/overlays/aws; do
            echo "::group::k8s/validate.py ${overlay}"
            python k8s/validate.py "${overlay}"
            echo "::endgroup::"
          done

  # ---------------------------------------------------------------------------
  # terraform-validate — STATIC validation of the Terraform IaC under terraform/.
  # Independent of the other jobs (needs no Python package, image, or cluster), so
  # it runs in parallel for fast feedback. Every step is static source analysis
  # that NEVER contacts AWS: canonical formatting, a provider-only init (no
  # backend, no state), configuration validation, a TFLint lint (language rules +
  # AWS ruleset), and a Trivy IaC misconfiguration scan. Tool versions are pinned
  # so a green run today is a green run tomorrow.
  #
  # It deliberately does NOT run `terraform plan` or `terraform apply`. A real
  # `plan` reads data sources (aws_caller_identity, aws_region,
  # aws_availability_zones), so it needs live AWS credentials — which are
  # intentionally absent from CI. Adding long-lived AWS keys to GitHub Actions to
  # make `plan` run would be the exact security regression this project refuses;
  # the boundary is documented instead (docs/ci-cd.md § "Terraform validation",
  # terraform/README.md § Planning). Cloud provisioning is a deliberate,
  # credentialed, out-of-band operation an operator runs against their OWN
  # account. Design of record: ADR-019.
  # ---------------------------------------------------------------------------
  terraform-validate:
    name: Terraform Validation (static, no AWS)
    runs-on: ubuntu-latest
    # Least privilege, restated explicitly at the job level: this job only reads
    # the repository. It carries no AWS identity and no write scope of any kind,
    # so even a compromised step cannot provision, publish, or mutate anything.
    permissions:
      contents: read
    env:
      # Pinned for reproducibility. Bump deliberately, not implicitly.
      TF_VERSION: 1.9.8
      TFLINT_VERSION: v0.54.0
      TRIVY_VERSION: v0.56.1
      # Keep the Trivy suppression list beside the Terraform it applies to.
      TRIVY_IGNOREFILE: terraform/.trivyignore
    defaults:
      run:
        working-directory: terraform
    steps:
      # Stage 1 — Checkout.
      - name: Checkout
        uses: actions/checkout@v4

      # Stage 2 — Pinned Terraform CLI. terraform_wrapper:false so raw exit codes
      # reach the shell (the wrapper wraps stdout/exit and changes step semantics).
      - name: Set up Terraform (pinned)
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Stage 3 — Canonical formatting. Checks (never rewrites) every .tf file
      # recursively; drift fails the job with an actionable message.
      - name: Terraform fmt (check, recursive)
        run: |
          terraform fmt -check -recursive || {
            echo "::error::Terraform files are not canonically formatted. Run 'terraform fmt -recursive' in terraform/ and commit the result."
            exit 1
          }

      # Stage 4 — Provider-only init. `-backend=false` installs the provider
      # plugins from the committed .terraform.lock.hcl WITHOUT configuring any
      # backend or touching state, and needs NO AWS credentials. It is the
      # prerequisite for `validate` (which needs the provider schema).
      - name: Terraform init (providers only — no backend, no AWS access)
        run: terraform init -backend=false -input=false

      # Stage 5 — Configuration validation. Checks syntax, types, references, and
      # provider-schema conformance. Makes NO AWS API calls and needs no
      # credentials; it is the primary correctness gate for the IaC.
      - name: Terraform validate
        run: |
          terraform validate -no-color || {
            echo "::error::terraform validate failed — the configuration is not internally consistent. Fix the reported errors."
            exit 1
          }

      # Stage 6 — TFLint (language best-practices preset + AWS ruleset). Static
      # lint only; contacts no cloud. Config lives in terraform/.tflint.hcl.
      - name: Set up TFLint (pinned)
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      # `tflint --init` fetches the pinned AWS ruleset plugin from GitHub;
      # GITHUB_TOKEN raises the anonymous API rate limit and is the repo-scoped,
      # read-only ephemeral Actions token — it carries NO AWS identity.
      - name: TFLint (init plugins + lint)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          tflint --no-color -f compact || {
            echo "::error::TFLint reported issues in terraform/. Fix them, or justify a rule exception in terraform/.tflint.hcl."
            exit 1
          }

      # Stage 7 — Trivy IaC misconfiguration scan. Static analysis of the
      # Terraform for insecure configuration (public exposure, missing encryption,
      # over-broad IAM, …). It reads only the source — no AWS access. Fails the
      # job on CRITICAL or HIGH findings. The few intentional, ADR-ratified
      # exposures for this SHORT-LIVED validation cluster (the open default API
      # CIDR, no KMS envelope encryption) are suppressed WITH justification in
      # terraform/.trivyignore, so any NEW critical/high the scanner surfaces is a
      # real, blocking regression rather than expected noise.
      #   NOTE: scan-ref is repo-root-relative (a `uses:` step ignores the job's
      #   working-directory), so it points at the `terraform` folder directly.
      - name: Trivy IaC security scan (Terraform misconfiguration)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: config
          scan-ref: terraform
          severity: CRITICAL,HIGH
          exit-code: "1"
          hide-progress: "true"
          version: ${{ env.TRIVY_VERSION }}

  # ---------------------------------------------------------------------------
  # k8s-cluster-dry-run — OPT-IN cluster admission check. This is the only job
  # that talks to a Kubernetes API server. It is NOT run per-PR (it would add
  # cluster-bootstrap cost and a flake surface to every change); trigger it
  # manually from the Actions tab (workflow_dispatch) when you want to validate
  # admission against a live API server. It stands up an *ephemeral* kind cluster
  # and does a server-side DRY RUN: every object passes through the API server's
  # validation, defaulting, and admission (including Pod Security) — but nothing
  # is persisted and the Job is never executed. This validates admissibility, not
  # deployment: a green admission here does NOT mean the pipeline ran. A verified
  # green end-to-end run is a separate, local activity (out-of-band dataset +
  # image imported into the node's containerd; see k8s/README § "Runtime execution
  # record (PR 8)" and ADR-013). The cluster is torn down when the job ends.
  # ---------------------------------------------------------------------------
  k8s-cluster-dry-run:
    name: K8s Cluster Admission (dry-run, manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Ephemeral kind cluster pinned to the same Kubernetes minor the static
      # schema gate targets. The action provisions kubectl + a working kubeconfig
      # and deletes the cluster at job end.
      - name: Create ephemeral kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          version: v0.23.0
          node_image: kindest/node:v1.31.0
          cluster_name: mlops-validate

      # A server-side dry-run admits the whole overlay without running it.
      # Namespaced objects need their namespace to exist first, so the throwaway
      # cluster gets the namespace for real, then the overlay is dry-run applied.
      - name: Server-side dry-run admission (validates, runs nothing)
        run: |
          set -euo pipefail
          echo "::group::create namespace (real, on throwaway cluster)"
          kubectl create namespace mlops --dry-run=client -o yaml | kubectl apply -f -
          echo "::endgroup::"
          # Both deployable overlays are admitted server-side. The AWS overlay's
          # ECR image is never pulled by a dry run, so admission works on the
          # throwaway kind cluster without any AWS access — it proves the cloud
          # overlay is admissible (passes API validation + Pod Security), not that
          # it runs. The real EKS execution is PR 7.
          for overlay in k8s/overlays/local k8s/overlays/aws; do
            echo "::group::kubectl apply -k ${overlay} --dry-run=server (admission only)"
            kubectl apply -k "${overlay}" --dry-run=server
            echo "::endgroup::"
          done
