[tool.pytest.ini_options]
# Test runner configuration. Run with: python -m pytest
#
# ``pythonpath = src`` mirrors how the stages run: they live in ``src/`` and
# import their siblings by bare module name (``from exceptions import ...``).
# Adding ``src`` to the path lets the tests import the pipeline the same way,
# without a package prefix or an editable install.
pythonpath = ["src"]
testpaths = ["tests"]

# ``-ra`` prints a short summary of everything that was not a plain pass
# (skips, xfails, errors) so the reason is visible without re-running verbose.
# ``--strict-markers`` turns a typo'd marker into an error instead of a silent
# no-op, keeping the marker taxonomy below honest.
addopts = "-ra --strict-markers"

# The pipeline's own test taxonomy. Select a slice with ``-m``, e.g.
# ``pytest -m smoke`` for the fast import/wiring checks.
markers = [
    "smoke: fast checks that the pipeline is importable and wired together",
    "unit: isolated tests of a single component with no external services",
    "integration: multi-stage tests that run stages together through real files (still no network; MLflow is stubbed)",
    "contract: static checks that dvc.yaml/params.yaml/src wiring obey the pipeline contract (pure parsing, no data/network)",
]

[tool.ruff]
# Linter and formatter for the pipeline. Run with: python -m ruff check (lint)
# and python -m ruff format (format). Ruff replaces the flake8/isort/black stack
# with a single, fast tool configured entirely here.
#
# ``line-length`` is 88 to match the formatter's default and the ``.editorconfig``
# ``max_line_length`` for ``*.py`` — one number, three tools agree.
line-length = 88
target-version = "py312"

# Stages run as scripts with ``src/`` on ``sys.path`` and import their siblings by
# bare module name (``from exceptions import ...``). Telling Ruff where the source
# roots are lets the import sorter classify those as first-party (grouped after the
# third-party block) instead of mistaking them for external packages.
src = ["src", "tests"]

# Ruff 0.16 formats Python code blocks embedded in Markdown. The docs deliberately
# contain illustrative and before/after snippets that are prose, not shipped code,
# so Markdown is excluded — Ruff governs the pipeline's ``.py`` sources only, and
# ``ruff check .`` / ``ruff format .`` behave the same as the scoped commands.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# Rule selection. Each family is enabled deliberately, not by turning on
# everything and suppressing the fallout:
#   E, W  pycodestyle errors/warnings   F   pyflakes (unused imports, names)
#   I     import sorting (isort)        UP  pyupgrade (modern 3.12 syntax)
#   B     bugbear (likely bugs)         C4  flake8-comprehensions
#   SIM   flake8-simplify              RUF  Ruff-specific rules (incl. RUF100,
#   BLE   flake8-blind-except               which flags unused ``# noqa``)
#
# ``BLE`` (blind ``except Exception``) is enabled on purpose: it flags silently
# swallowed catches (``except Exception: pass``). Ruff does not flag the one
# deliberate process-boundary catch in ``stage_runner.py`` because that handler
# logs the exception (via ``logger.exception``) rather than hiding it — exactly
# the distinction the rule is meant to enforce.
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF", "BLE"]

[tool.mypy]
# Static type checking for the pipeline. Run with: python -m mypy
python_version = "3.12"
files = ["src"]

# Stages run as scripts with ``src/`` on ``sys.path`` and import siblings by
# their bare module name (``from exceptions import ...``). Mirroring that here
# lets mypy resolve those imports the same way the interpreter does at runtime.
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

# Strictness: require complete annotations and surface silent ``Any`` leaks,
# without resorting to per-line suppressions.
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
no_implicit_optional = true
strict_equality = true

# The imported third-party libraries below are not type-checked: mlflow and
# scikit-learn ship no type information at all, while pandas and yaml have stub
# packages (pandas-stubs, types-PyYAML) that are not installed here. Ignoring
# their missing imports scopes "untyped" strictly to those third-party
# boundaries; it does not weaken checking of the pipeline's own code.
# (python-dotenv ships its own types, so it is omitted and stays checked.)
[[tool.mypy.overrides]]
module = [
    "mlflow.*",
    "sklearn.*",
    "pandas",
    "pandas.*",
    "yaml",
]
ignore_missing_imports = true
