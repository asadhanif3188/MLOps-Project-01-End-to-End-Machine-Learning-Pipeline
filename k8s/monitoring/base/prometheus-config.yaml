# Prometheus scrape configuration (Sprint 8, PR 2).
#
# This is deliberately MINIMAL and hand-written — exactly the targets this
# project's four-layer model needs and nothing more (the sprint brief: "explicitly
# configure only what the project needs", do not blindly import a packaged stack).
# Five scrape jobs cover Layer 1 (K8s platform) and Layer 2 (the batch Job):
#   1. prometheus            — self-monitoring (is Prometheus itself healthy?).
#   2. kube-state-metrics    — API-object state: Job success/duration/OOM (Layer 2)
#                              and node/pod/PVC/Deployment/StatefulSet state (L1/3/4).
#   3. node-exporter         — per-node CPU/memory/filesystem (Layer 1).
#   4. kubernetes-cadvisor   — per-container CPU/memory via the kubelet's built-in
#                              cAdvisor (Layer 1 usage-vs-limit).
#   5. pushgateway           — the ephemeral pipeline Job's OPERATIONAL metrics:
#                              per-stage duration + success/failure, pushed before
#                              the pod exits (Layer 2 per-stage granularity KSM
#                              cannot give — Sprint 8, PR 3; ADR-030).
#
# Layer 3/4 DEPTH (blackbox `/health`, postgres-exporter) is intentionally ABSENT
# — it is Sprint 8 PR 4, and adding it now would exceed this PR's scope.
#
# No alerting rules and no Alertmanager here (that is PR 5); no remote_write / no
# long-term store (ADR-028 § 5 — short local retention only). The config is a
# plain ConfigMap (fixed name, matching the repo's mlflow-config style) mounted at
# /etc/prometheus; changing it requires a pod restart, which is fine for a config
# that changes rarely on a single-operator cluster.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: mlops-pipeline
    app.kubernetes.io/component: metrics-server
    app.kubernetes.io/managed-by: kustomize
data:
  prometheus.yml: |
    global:
      # 30s is ample for a batch platform (nothing here is latency-sensitive) and
      # keeps TSDB churn — hence emptyDir usage — modest. The queryability
      # contract (ADR-028 § 3) only needs the finished Job to outlive ONE interval;
      # the Job's ttlSecondsAfterFinished (k8s/base/job.yaml) is far larger.
      scrape_interval: 30s
      evaluation_interval: 30s
      external_labels:
        cluster: mlops-pipeline

    scrape_configs:
      # 1. Prometheus self-monitoring.
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      # 2. kube-state-metrics — discovered via its Service Endpoints in the
      #    monitoring namespace, keeping only the metrics port (8080), not the
      #    telemetry port (8081).
      - job_name: kube-state-metrics
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: ["monitoring"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
            action: keep
            regex: kube-state-metrics
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: http-metrics

      # 3. node-exporter — one target per DaemonSet pod via the headless Service's
      #    Endpoints. The instance label is set to the node name for legibility.
      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: ["monitoring"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
            action: keep
            regex: node-exporter
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: metrics
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: instance

      # 4. cAdvisor (per-container metrics) — scraped from each node's kubelet via
      #    the API server proxy. This is the standard in-cluster pattern: use the
      #    pod's ServiceAccount bearer token, trust the API server CA, and rewrite
      #    the target to the kubelet's /metrics/cadvisor subresource. Requires the
      #    read-only nodes/proxy RBAC granted in prometheus.yaml.
      - job_name: kubernetes-cadvisor
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

      # 5. Pushgateway — OPERATIONAL metrics the ephemeral pipeline Job pushes
      #    before it exits (per-stage duration + success, src/pipeline_metrics.py;
      #    Sprint 8, PR 3). honor_labels: true is ESSENTIAL here: it PRESERVES the
      #    job/stage labels the pipeline attached at push time instead of overwriting
      #    `job` with this scrape's own "pushgateway" — without it every pushed series
      #    would collapse onto the gateway's identity and the per-stage attribution
      #    would be lost. Discovered via the Pushgateway Service Endpoints in the
      #    monitoring namespace, keeping the http port.
      - job_name: pushgateway
        honor_labels: true
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: ["monitoring"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
            action: keep
            regex: pushgateway
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: http
