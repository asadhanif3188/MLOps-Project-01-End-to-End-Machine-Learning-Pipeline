# Local overlay — specializes the base for a local cluster (kind / minikube).
#
# This is where the base/overlay split pays off: the base names the workload
# image but leaves the tag open, and this overlay pins the tag a developer
# actually builds on their machine. A future staging/prod overlay repoints
# `newName` to a registry path and `newTag` to a released version here — without
# editing the base. Later PRs extend this same overlay with local-appropriate
# config, keeping environment differences in one place.
#
# Render and inspect with:  kustomize build k8s/overlays/local
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  # Local S3 artifact backend for the MLflow platform (Sprint 7, PR 6): MinIO
  # (S3-compatible) + a one-shot Job that creates the `mlflow` bucket. On AWS the
  # equivalent is a real Terraform-provisioned S3 bucket, so these render ONLY in
  # the local overlay. See ADR-026 and minio.yaml.
  - minio.yaml
  - minio-setup-job.yaml
  - mlflow-boto-config.yaml

# Pin the base image to the tag built locally per the README (§ "Running with
# Docker") and docker-compose (`ml-pipeline:local`). For a local kind/minikube
# run the image is side-loaded into the cluster (e.g.
# `kind load docker-image ml-pipeline:local`) rather than pulled from a registry.
# The MLflow server image (docker/mlflow/Dockerfile) is likewise built and imported
# locally as `mlflow-server:local`.
# A published registry tag and an explicit imagePullPolicy are deferred until
# image publishing exists (roadmap).
images:
  - name: ml-pipeline
    newTag: local
  - name: mlflow-server
    newTag: local

# Patches (Sprint 7, PR 6):
#   * job-runtime.yaml       — layers the LOCAL dataset mount onto the base Job
#     (the base provides the environment-independent DVC no-SCM config; the former
#     MLflow file-store override is removed — the Job now logs to the in-cluster
#     server). Rationale in the patch and ADR-013.
#   * mlflow-local-patch.yaml — points the MLflow server's S3 client at the
#     in-cluster MinIO (endpoint URL + path-style addressing). Rationale in the
#     patch and ADR-026.
patches:
  - path: job-runtime.yaml
  - path: mlflow-local-patch.yaml
