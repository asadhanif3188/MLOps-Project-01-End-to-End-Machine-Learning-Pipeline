# ConfigMap — non-secret runtime configuration for the pipeline.
#
# Twelve-factor config: the image stays immutable and environment-specific,
# non-sensitive values are injected at run time (consistent with ADR-005 and the
# docker-compose `environment:` block). Only values that are genuinely NOT secret
# live here; credentials go in Secrets, never here.
#
# Every key is a real environment variable the application code reads:
#   * LOG_LEVEL          — read by src/logging_config.py (default "INFO").
#   * MLFLOW_TRACKING_URI — read by src/train.py / src/evaluate.py via
#                           require_env("MLFLOW_TRACKING_URI"); passed to
#                           mlflow.set_tracking_uri(). It points at the in-cluster
#                           MLflow Tracking Server's ClusterIP Service (Sprint 7,
#                           PR 6): the pipeline logs experiments to the PERSISTENT,
#                           self-hosted platform (PostgreSQL + S3), not to an
#                           external SaaS. It is an ENDPOINT, not a credential; the
#                           server runs internal-only with no client auth, so the
#                           pipeline needs no MLflow username/password.
#
# DagsHub removed (ADR-026). The former public DagsHub MLflow endpoint and its
# out-of-band credential Secret are gone: experiment tracking now runs on the
# in-cluster platform under this project's own control. (DVC's separate
# S3-compatible data remote in .dvc/config is a different concern — data/model
# versioning — and is out of scope for this change.)
apiVersion: v1
kind: ConfigMap
metadata:
  name: mlops-pipeline-config
  namespace: mlops
  labels:
    app.kubernetes.io/name: mlops-pipeline
    app.kubernetes.io/part-of: mlops-pipeline
    app.kubernetes.io/component: config
    app.kubernetes.io/managed-by: kustomize
data:
  LOG_LEVEL: "INFO"
  # In-cluster MLflow Tracking Server Service (base/mlflow/deployment.yaml). The
  # fully-qualified name resolves from any namespace; within mlops, `mlflow:5000`
  # also works. Both overlays use this same server — they differ only in the
  # server's artifact backend (local MinIO vs real S3), which is transparent to
  # the client. The service DNS name lives HERE, not in Python: the code resolves
  # it from this env var (src/mlflow_config.py), so no namespace/Service name is
  # hardcoded in the application.
  MLFLOW_TRACKING_URI: "http://mlflow.mlops.svc.cluster.local:5000"
  # Experiment the pipeline's train/evaluate runs are grouped under on the server
  # (read by src/mlflow_config.resolve_experiment_name). Optional — the code
  # defaults to "mlops-pipeline" — but set explicitly so the grouping is legible
  # in the manifest and easy to repoint per environment.
  MLFLOW_EXPERIMENT_NAME: "mlops-pipeline"
  # Pinned dataset identity (Sprint 7, PR 8 — ADR-027). The SHA-256 of the exact
  # dataset bytes the pipeline expects. The `fetch-dataset` init container
  # (src/fetch_dataset.py) verifies the object it downloads from S3 against this
  # value and fails the Job on a mismatch, so a swapped/corrupt object cannot
  # silently enter a run. It lives in the BASE because the dataset identity is the
  # SAME in every environment; the environment-specific SOURCE (DATASET_S3_URI /
  # endpoint / credentials) is layered by the overlays. This is the Pima Indians
  # Diabetes dataset (23,872 bytes; DVC md5 739f3c9177b13d1c15aa060046cfb023 — see
  # data/raw/data.csv.dvc and docs/dataset.md).
  DATASET_SHA256: "ee5b0c92d5ad461e86151c544b3b76bd6269c6052c5eb628c4b0618a08cffc89"
