# node-exporter — per-node kernel/hardware metrics (Sprint 8, PR 2). It runs as a
# DaemonSet (one pod per node) and reads the node's `/proc`, `/sys`, and root
# filesystem to report the Layer 1 node signals in docs/observability.md that no
# in-cluster exporter can produce: `node_memory_MemAvailable_bytes`,
# `node_filesystem_avail_bytes`, `node_cpu_seconds_total`, load, etc.
#
# ─────────────────────────────────────────────────────────────────────────────
# THE DOCUMENTED SECURITY EXCEPTION (requirement 7 & 8; ADR-029).
# Reading node kernel interfaces requires `hostPath` volumes, which the
# `restricted`/`baseline` Pod Security Standards forbid — this is why the
# `monitoring` namespace is `privileged` (namespace.yaml). The exception is kept
# as NARROW as possible:
#   * The ONLY relaxation is the three READ-ONLY hostPath mounts below.
#   * NO hostNetwork, NO hostPID, NO hostIPC — node-exporter is scraped on its
#     POD IP (Prometheus endpoints SD, prometheus-config.yaml), not the host
#     network. Trade-off: network-device metrics reflect the pod's netns rather
#     than the host's; the node CPU/memory/filesystem signals this project
#     actually alerts on come from the read-only `/proc` + `/sys` + rootfs mounts
#     and are unaffected. Adopting hostNetwork/hostPID is a deferred, separately
#     justified change, not taken "because the upstream chart does".
#   * NOT privileged, drops ALL capabilities, no privilege escalation, non-root
#     (uid 65534), seccomp RuntimeDefault, read-only root FS. It is as hardened as
#     the fully-`restricted` components except for the unavoidable hostPath.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: node-exporter
    app.kubernetes.io/part-of: mlops-pipeline
    app.kubernetes.io/component: exporter
    app.kubernetes.io/managed-by: kustomize
# node-exporter does NOT call the Kubernetes API (it reads host files and serves
# metrics), so it needs no token — automount off, matching the fleet-wide default
# and keeping an unused, exfiltratable token out of the pod (least privilege).
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: node-exporter
    app.kubernetes.io/part-of: mlops-pipeline
    app.kubernetes.io/component: exporter
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-exporter
        app.kubernetes.io/part-of: mlops-pipeline
        app.kubernetes.io/component: exporter
    spec:
      serviceAccountName: node-exporter
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # nobody:nobody — node-exporter reads the host pseudo-filesystems as an
        # unprivileged user; root is not required to read /proc and /sys.
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      # Schedule on every node, including any future control-plane/tainted nodes,
      # so node coverage is complete. On the current managed node group (all
      # workers, no taints) this is a no-op, but it makes coverage correct by
      # construction if a tainted node is ever added.
      tolerations:
        - operator: Exists
      containers:
        - name: node-exporter
          # Pinned, non-latest. Prometheus community image.
          image: quay.io/prometheus/node-exporter:v1.8.2
          args:
            # Point the collectors at the READ-ONLY host mounts below rather than
            # the container's own /proc,/sys (which would report the pod, not the
            # node).
            - --path.procfs=/host/proc
            - --path.sysfs=/host/sys
            - --path.rootfs=/host/root
            # Ignore pseudo/virtual filesystems so filesystem metrics reflect real
            # node storage only (the standard mount-point/fs-type ignore lists).
            - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
            - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$
            - --web.listen-address=:9100
          ports:
            - name: metrics
              containerPort: 9100
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          # The documented exception: three READ-ONLY host mounts. readOnly: true
          # on every one — node-exporter only ever reads them.
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
            - name: root
              mountPath: /host/root
              mountPropagation: HostToContainer
              readOnly: true
      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
        - name: root
          hostPath:
            path: /
---
# Headless metrics Service — its sole job is to publish node-exporter's Endpoints
# so Prometheus's endpoints service discovery enumerates EVERY DaemonSet pod.
# Prometheus reads the Endpoints object and scrapes each pod IP directly (it does
# not go through a Service VIP), so a normal ClusterIP would surface every pod too;
# headless (clusterIP: None) is chosen because this Service is only a discovery
# handle and never receives client traffic, so allocating a cluster IP would be
# unused. Internal-only either way.
apiVersion: v1
kind: Service
metadata:
  name: node-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: node-exporter
    app.kubernetes.io/part-of: mlops-pipeline
    app.kubernetes.io/component: exporter
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: node-exporter
  ports:
    - name: metrics
      port: 9100
      targetPort: metrics
