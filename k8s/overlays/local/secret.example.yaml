# =============================================================================
# SECRET TEMPLATE — EXAMPLE ONLY. SAFE TO COMMIT. CONTAINS NO REAL CREDENTIALS.
# =============================================================================
#
# The S3 (MinIO) credentials for the LOCAL MLflow artifact store. Placeholders
# only — NEVER commit real values.
#
# NOT listed in the local overlay's kustomization.yaml, so it never renders or
# applies. Create the real Secret out-of-band before deploying (pick strong,
# alphanumeric values ≥ 8 chars — MinIO requires it):
#
#   kubectl create secret generic mlflow-s3-credentials \
#     --namespace mlops \
#     --from-literal=AWS_ACCESS_KEY_ID="$(openssl rand -hex 12)" \
#     --from-literal=AWS_SECRET_ACCESS_KEY="$(openssl rand -base64 24 | tr -d '/+=')"
#
# The SAME two keys serve both sides of the local S3 story:
#   * MinIO (minio.yaml) consumes them as MINIO_ROOT_USER / MINIO_ROOT_PASSWORD.
#   * The MLflow server (base Deployment envFrom) consumes them as
#     AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY for its boto3 S3 client.
#
# On AWS there is NO such Secret: the MLflow server gets S3 access from EKS Pod
# Identity (workload identity), so no static keys exist to leak (ADR-026).
apiVersion: v1
kind: Secret
metadata:
  name: mlflow-s3-credentials
  namespace: mlops
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: mlops-pipeline
    app.kubernetes.io/component: artifact-store-credentials
type: Opaque
stringData:
  # Placeholders — replace out-of-band (see the header). DO NOT COMMIT REAL VALUES.
  AWS_ACCESS_KEY_ID: "REPLACE_WITH_S3_ACCESS_KEY"
  AWS_SECRET_ACCESS_KEY: "REPLACE_WITH_S3_SECRET_KEY"
