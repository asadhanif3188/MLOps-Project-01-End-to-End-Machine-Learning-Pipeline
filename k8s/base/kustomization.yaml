# Base Kustomization — the environment-independent definition of the workload.
#
# Kustomize (not raw `kubectl apply -f`) is used because it earns its keep here:
# a single base is specialized per environment through overlays (image tag today;
# resources, config, and security in later PRs) with no copy-paste YAML. Render
# and inspect with:  kustomize build k8s/base
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Pin every namespaced resource to the mlops namespace. The Namespace object
# itself is created by namespace.yaml (the namespace transformer does not nest a
# Namespace inside itself), so both the boundary and its members stay consistent.
namespace: mlops

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - dvc-config.yaml
  - job.yaml
  # Least-privilege NetworkPolicies (Sprint 8, PR 7; ADR-034): the namespace-wide
  # default-deny baseline, DNS preservation, and the pipeline's env-independent
  # egress (MLflow + Pushgateway). The MLflow platform's own policies live in the
  # mlflow component (mlflow/networkpolicy.yaml); the env-specific S3 egress is
  # layered by the overlays. Enforced only where the CNI supports it (ADR-034).
  - networkpolicy.yaml
  # The persistent in-cluster MLflow tracking platform (Sprint 7, PR 6): the
  # PostgreSQL metadata backend, the MLflow Tracking Server, and their Services +
  # identity. Included as a component directory so the platform is one legible
  # unit. The pipeline Job logs to it via the in-cluster Service (see
  # configmap.yaml MLFLOW_TRACKING_URI). Design of record: ADR-026.
  - mlflow
  # The credential TEMPLATES (base/mlflow/secret.example.yaml for the DB, and the
  # overlays' S3 templates) are intentionally NOT resources: they are committed
  # *templates* with placeholder values, never applied. The real Secrets are
  # created out-of-band so credentials never enter git or a rendered manifest
  # (see the templates and k8s/README.md § "Secrets").

# Common identifying metadata for every resource. includeSelectors is false on
# purpose: a Job's spec.selector is auto-generated and immutable, so a label
# transformer must not rewrite it — doing so would make the Job un-appliable.
# These are metadata labels only.
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: mlops-pipeline
      app.kubernetes.io/managed-by: kustomize
