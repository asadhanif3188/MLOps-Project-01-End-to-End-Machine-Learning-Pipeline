# Parameters for the *fixture* reproducibility pipeline (NOT the production one).
#
# This mirrors the root ``params.yaml`` section-for-section so the unmodified
# ``src/`` stages run against it unchanged, but every path is relative to this
# directory (the fixture pipeline's working dir) and the model is deliberately
# small (fewer, shallower trees) so a full ``dvc repro`` finishes in a second in
# CI. Seeds are fixed and explicit — they are what makes repeated reproduction
# produce equivalent outputs (see ADR-008).
preprocess:
  input: data/raw/data.csv
  output: data/processed/data.csv

split:
  input: data/processed/data.csv
  train_output: data/processed/train.csv
  test_output: data/processed/test.csv
  target: Outcome
  test_size: 0.25
  random_state: 42

train:
  input: data/processed/train.csv
  output: models/model.pkl
  target: Outcome
  random_state: 42
  n_estimators: 25
  max_depth: 3

evaluate:
  data: data/processed/test.csv
  model: models/model.pkl
  target: Outcome
  metrics: metrics/metrics.json
