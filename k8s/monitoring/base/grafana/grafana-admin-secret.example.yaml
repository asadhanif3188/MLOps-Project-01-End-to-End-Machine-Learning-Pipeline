# =============================================================================
# SECRET TEMPLATE — EXAMPLE ONLY. SAFE TO COMMIT. CONTAINS NO REAL CREDENTIALS.
# =============================================================================
#
# This is a *template*, not an applied manifest. It documents the shape of the
# admin-credential Secret that Grafana (Sprint 8, PR 5; ADR-032) expects. The values
# below are placeholders — NEVER put a real password here or commit a filled-in copy.
#
# Like the other credential Secrets in this repo (mlflow db creds, postgres-exporter
# creds), it is deliberately NOT listed in the monitoring kustomization, so
# `kustomize build` / `kubectl apply -k` never render or apply it. The real Secret is
# created out-of-band, so the admin password never passes through git or a rendered
# manifest.
#
# ─────────────────────────────────────────────────────────────────────────────
# Create the Secret before deploying Grafana (keys consumed as
# GF_SECURITY_ADMIN_USER / GF_SECURITY_ADMIN_PASSWORD; see grafana.yaml):
#
#   kubectl create secret generic grafana-admin-credentials \
#     --namespace monitoring \
#     --from-literal=admin-user=admin \
#     --from-literal=admin-password='REPLACE_WITH_A_STRONG_PASSWORD'
#
# Anonymous VIEW access to the dashboards does not need this credential (see
# grafana.yaml GF_AUTH_ANONYMOUS_*); it is only required to log in as admin for
# editing/configuration. Rotation: re-create the Secret and restart the Grafana pod.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-credentials
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: mlops-pipeline
    app.kubernetes.io/component: dashboards
type: Opaque
stringData:
  # Placeholders — replace out-of-band (see the header). DO NOT COMMIT REAL VALUES.
  admin-user: "changeme-admin-user"
  admin-password: "changeme-set-a-strong-password"
