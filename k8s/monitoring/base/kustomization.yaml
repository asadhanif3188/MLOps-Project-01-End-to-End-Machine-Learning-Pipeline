# Monitoring base Kustomization — the environment-independent metrics foundation
# (Sprint 8, PR 2). Kept as a SEPARATE kustomize root from k8s/base (the mlops
# workload) so the observability stack has its own lifecycle and namespace, per
# ADR-028 § 4. Render and inspect with:  kustomize build k8s/monitoring/base
#
# Everything here is env-independent: the images come from public registries and
# the TSDB is an emptyDir, so the base is identical on Docker Desktop and EKS. The
# overlays (k8s/monitoring/overlays/{local,aws}) exist for future per-environment
# deltas (e.g. a gp3 PVC or remote_write on AWS) and today simply include this
# base — the same base/overlay split the mlops workload uses.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Pin every namespaced resource to the monitoring namespace. The Namespace object
# itself is created by namespace.yaml (the namespace transformer does not nest a
# Namespace inside itself). Cluster-scoped RBAC (ClusterRole/ClusterRoleBinding)
# is unaffected by this — it has no namespace.
namespace: monitoring

resources:
  - namespace.yaml
  - kube-state-metrics.yaml
  - node-exporter.yaml
  - pushgateway.yaml
  - blackbox-exporter.yaml
  - prometheus-config.yaml
  - prometheus.yaml
  # Grafana dashboards layer (Sprint 8, PR 5; ADR-032). The datasource + dashboard-
  # provider provisioning ConfigMaps and the hardened, internal-only Grafana
  # Deployment/Service/SA. The admin Secret is created out-of-band (see
  # grafana/grafana-admin-secret.example.yaml), never rendered here.
  - grafana/grafana-datasource.yaml
  - grafana/grafana-dashboard-provider.yaml
  - grafana/grafana.yaml

# The three dashboard JSON files are kept as first-class, version-controlled,
# individually-validatable files under grafana/dashboards/ and packaged into ONE
# ConfigMap (grafana-dashboards) here — so the JSON never has to be embedded as a
# YAML string. Grafana's dashboard provider (grafana-dashboard-provider.yaml) mounts
# and loads this ConfigMap. disableNameSuffixHash keeps the name stable
# (`grafana-dashboards`, referenced by the Deployment volume) and matches the fixed-
# name convention the rest of this stack uses; the provider re-reads the directory on
# an interval, so a content change is picked up without a hash-driven pod restart.
configMapGenerator:
  - name: grafana-dashboards
    files:
      - grafana/dashboards/eks-platform-health.json
      - grafana/dashboards/mlops-pipeline-operations.json
      - grafana/dashboards/mlflow-platform-health.json

generatorOptions:
  disableNameSuffixHash: true

# Common identifying metadata. includeSelectors is false so label transforms never
# rewrite an immutable selector (same rationale as k8s/base).
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: mlops-pipeline
      app.kubernetes.io/managed-by: kustomize
