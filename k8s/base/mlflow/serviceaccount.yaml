# ServiceAccount — the MLflow Tracking Server's own identity.
#
# A dedicated identity (not the namespace `default`) for two reasons:
#   1. Least privilege, consistent with the pipeline's ServiceAccount: any future
#      RBAC/admission policy is scoped to the server alone.
#   2. It is the SUBJECT of AWS workload identity on EKS. The AWS overlay's
#      Terraform binds THIS service account (namespace `mlops`, name
#      `mlflow-server`) to a dedicated IAM role via EKS Pod Identity, so the
#      tracking server reads/writes its S3 artifact bucket with a short-lived,
#      pod-scoped role instead of static AWS keys (ADR-026, terraform/s3.tf).
#
# automountServiceAccountToken: false — the MLflow server does NOT call the
# Kubernetes API. It serves HTTP, talks to PostgreSQL, and talks to S3; it never
# reads or mutates cluster objects, so mounting an API token would be an unused,
# exfiltratable credential. (Workload identity for S3 is delivered by the EKS Pod
# Identity agent, which does not depend on this projected token.)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlflow-server
  namespace: mlops
  labels:
    app.kubernetes.io/name: mlflow-server
    app.kubernetes.io/part-of: mlops-pipeline
    app.kubernetes.io/component: tracking-identity
    app.kubernetes.io/managed-by: kustomize
automountServiceAccountToken: false
