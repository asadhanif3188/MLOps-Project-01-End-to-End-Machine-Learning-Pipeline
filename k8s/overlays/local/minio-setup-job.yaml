# MinIO bucket bootstrap — LOCAL OVERLAY ONLY (Sprint 7, PR 6).
#
# Neither MLflow nor the pipeline creates its S3 bucket; both expect the bucket to
# already exist. On AWS, Terraform creates them (terraform/s3.tf for the MLflow
# artifact bucket, terraform/datasets.tf for the dataset bucket). Locally, this
# one-shot Job creates BOTH buckets in MinIO using the MinIO client (`mc`),
# idempotently:
#   * `mlflow`   — the MLflow artifact store (Sprint 7, PR 6).
#   * `datasets` — the pipeline's raw-input dataset store (Sprint 7, PR 8; the
#     local stand-in for the Terraform-provisioned dataset bucket). The dataset
#     OBJECT is uploaded out-of-band after this Job runs (see k8s/README.md §
#     "Dataset"); this Job only ensures the bucket exists.
#
# It waits for MinIO to become reachable, then `mc mb --ignore-existing` creates
# the buckets (safe to re-run). The Job is finite (restartPolicy: Never,
# backoffLimit for transient MinIO-not-up-yet retries) — the same finite-run
# discipline as the pipeline Job (ADR-009).
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-setup
  namespace: mlops
  labels:
    app.kubernetes.io/name: minio-setup
    app.kubernetes.io/part-of: mlops-pipeline
    app.kubernetes.io/component: artifact-store-bootstrap
    app.kubernetes.io/managed-by: kustomize
spec:
  backoffLimit: 10
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-setup
        app.kubernetes.io/part-of: mlops-pipeline
        app.kubernetes.io/component: artifact-store-bootstrap
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mc
          # Pinned MinIO client.
          image: minio/mc:RELEASE.2024-10-08T09-37-26Z
          command: ["/bin/sh", "-c"]
          args:
            - >
              set -e;
              until mc alias set local http://minio:9000 "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" >/dev/null 2>&1; do
                echo "waiting for minio..."; sleep 3;
              done;
              mc mb --ignore-existing local/mlflow;
              mc mb --ignore-existing local/datasets;
              echo "buckets local/mlflow and local/datasets ready";
          env:
            # mc writes its config under $MC_CONFIG_DIR; point it at a writable
            # path for the non-root numeric user (its HOME does not exist).
            - name: MC_CONFIG_DIR
              value: /tmp/.mc
          envFrom:
            # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY — the same MinIO root creds.
            - secretRef:
                name: mlflow-s3-credentials
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
