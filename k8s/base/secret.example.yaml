# =============================================================================
# SECRET TEMPLATE — EXAMPLE ONLY. SAFE TO COMMIT. CONTAINS NO REAL CREDENTIALS.
# =============================================================================
#
# This is a *template*, not an applied manifest. It documents the shape of the
# Secret the pipeline expects; the values below are placeholders. NEVER put real
# credentials in this file or commit a filled-in copy.
#
# It is deliberately NOT listed in base/kustomization.yaml, so `kubectl apply -k`
# and `kustomize build` never render or apply it. The real Secret is created
# out-of-band, straight from your local .env, so credentials never pass through
# git or a rendered manifest:
#
#   kubectl create secret generic mlops-pipeline-secret \
#     --namespace mlops \
#     --from-env-file=.env
#
# (.env is git-ignored — see .env.example for the three variables it holds. The
# --from-env-file above also imports MLFLOW_TRACKING_URI; that is harmless because
# the ConfigMap value wins when both set the same key via envFrom in the listed
# order. To load only the two credential keys, use repeated --from-literal
# instead.)
#
# Keys — the exact names the app / MLflow client read from the environment:
#   * MLFLOW_TRACKING_USERNAME — DagsHub username (basic-auth user for MLflow).
#   * MLFLOW_TRACKING_PASSWORD — DagsHub access token (basic-auth password).
# Both are consumed by the MLflow client during train/evaluate tracking calls.
#
# Lifecycle: rotate by re-creating the Secret (delete + create, or
# `kubectl create secret ... --dry-run=client -o yaml | kubectl apply -f -`); the
# next Job run picks up the new values. To remove: `kubectl -n mlops delete secret
# mlops-pipeline-secret`.
apiVersion: v1
kind: Secret
metadata:
  name: mlops-pipeline-secret
  namespace: mlops
  labels:
    app.kubernetes.io/name: mlops-pipeline
    app.kubernetes.io/part-of: mlops-pipeline
    app.kubernetes.io/component: credentials
type: Opaque
stringData:
  # Placeholders — replace out-of-band (see the header). DO NOT COMMIT REAL VALUES.
  MLFLOW_TRACKING_USERNAME: "REPLACE_WITH_DAGSHUB_USERNAME"
  MLFLOW_TRACKING_PASSWORD: "REPLACE_WITH_DAGSHUB_TOKEN"
