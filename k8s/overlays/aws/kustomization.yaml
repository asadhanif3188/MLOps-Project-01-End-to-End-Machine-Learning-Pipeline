# AWS overlay — specializes the SAME base for the Terraform-provisioned EKS
# platform (Sprint 6, PR 5 — Cloud Runtime Integration).
#
# This overlay reuses `../../base` unchanged and layers ONLY what genuinely
# differs on EKS versus a local cluster. It deliberately does NOT copy the
# workload: the Namespace, ServiceAccount, ConfigMap, DVC no-SCM config, and the
# hardened Job (securityContext, resources, lifecycle) all come from the base, so
# every Sprint 5 security control is inherited verbatim — this overlay changes
# none of them. See ADR-018 and k8s/README.md § "AWS overlay".
#
# The three cloud-specific differences, and where each is expressed:
#   1. Image source — a registry (Amazon ECR), not a side-loaded local image.
#      Expressed by the `images` transformer below.
#   2. Image pull policy + runtime dataset source — expressed by the strategic
#      merge patch `job-cloud.yaml`.
#   3. MLflow backend — the AWS overlay intentionally does NOT override
#      MLFLOW_TRACKING_URI: both overlays use the SAME in-cluster MLflow Service
#      from the base ConfigMap (ADR-026), needing no credentials. They differ only
#      in the server's own artifact store (local MinIO vs real Amazon S3), which is
#      transparent to the pipeline. (Pre-Sprint-7 this was a DagsHub endpoint on
#      AWS and an in-pod file store locally; both are gone.)
#
# Render and inspect with:  kustomize build k8s/overlays/aws
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Cloud image source. Nodes run in the PRIVATE subnets (ADR-015) and cannot see a
# locally built image, so on EKS the workload image is PULLED from a registry —
# Amazon ECR, which is now provisioned and managed by Terraform (terraform/ecr.tf,
# ADR-021; the manual `aws ecr create-repository` step is gone). The node role
# carries AmazonEC2ContainerRegistryReadOnly from ADR-016, so the kubelet
# authenticates the pull with the node's instance role — no pod-level credential
# or IRSA.
#
# The values below are a committed PLACEHOLDER: `000000000000` (the AWS account ID)
# and the region. They are filled in for the operator's OWN account at deploy time
# WITHOUT editing this file, by scripts/render-cloud-manifests.sh — it reads the
# Terraform-managed registry URL (`terraform output -raw ecr_repository_url`) and
# renders a temp copy of this overlay (see docs/cloud-operations.md § deploy).
#
# (equivalently: ml-pipeline=<account>.dkr.ecr.<region>.amazonaws.com/mlops-pipeline:1.6.0)
#
# The tag is an explicit, immutable version (`1.6.0`, the image's BUILD_VERSION —
# see the root README § "Running with Docker"), never `:latest`, so a run is
# reproducible and the static image-pinning check passes.
images:
  - name: ml-pipeline
    newName: 000000000000.dkr.ecr.us-east-1.amazonaws.com/mlops-pipeline
    newTag: "1.6.0"
  # The MLflow Tracking Server image (docker/mlflow/Dockerfile), pushed to its OWN
  # Terraform-managed ECR repository (terraform/ecr.tf: aws_ecr_repository.mlflow_server).
  # Committed PLACEHOLDER (account id / region), filled in for the operator's OWN
  # account WITHOUT editing this file by scripts/render-cloud-manifests.sh (from
  # `terraform output -raw mlflow_server_ecr_repository_url`), never `:latest`
  # (Sprint 7, PR 6 — ADR-026).
  - name: mlflow-server
    newName: 000000000000.dkr.ecr.us-east-1.amazonaws.com/mlflow-server
    newTag: "0.1.0"

# Cloud-specific patches, each a small strategic-merge so the AWS-vs-base delta is
# legible:
#   * job-cloud.yaml    — image pull policy + the runtime dataset source (Sprint 6).
#   * mlflow-cloud.yaml  — point the MLflow server at the real S3 bucket and rely on
#     EKS Pod Identity for S3 credentials (no MinIO, no static keys). ADR-026.
# Neither weakens any security field.
patches:
  - path: job-cloud.yaml
  - path: mlflow-cloud.yaml
  # Pin the Postgres PVC to EKS's gp2 StorageClass (Sprint 7, PR 10). The base
  # volumeClaimTemplate intentionally leaves storageClassName unset to use the
  # cluster DEFAULT class (portable to Docker Desktop / kind); EKS 1.35 ships a gp2
  # class served by the EBS CSI driver (terraform/ebs-csi.tf) but marks NO default,
  # so the claim binds to nothing ("no storage class is set") and Postgres — hence
  # the whole MLflow platform — never starts. A surgical JSON6902 add (not a
  # strategic merge, which would replace the whole claim spec and drop accessModes/
  # resources) sets ONLY the class, an env-specific concern that belongs in the
  # overlay, not the shared base.
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: mlflow-postgres
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: gp2
