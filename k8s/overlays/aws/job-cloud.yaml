# AWS-overlay runtime patch (Sprint 6, PR 5 — Cloud Runtime Integration; dataset
# rewire Sprint 7, PR 8 — closes M-04).
#
# Strategic-merge patch onto the base Job. It carries ONLY the cloud-specific
# runtime inputs; everything else — the pod/container securityContext
# (runAsNonRoot + uid/gid 10001, fsGroup 10001, seccomp RuntimeDefault,
# allowPrivilegeEscalation false, capabilities drop ALL), the resource
# requests/limits, the finite-run lifecycle, the ServiceAccount, the DVC no-SCM
# config mount, the fetch-dataset init container, and the shared dataset emptyDir —
# is inherited UNCHANGED from the base. This patch weakens nothing: it adds an
# image pull policy and the cloud dataset SOURCE, and touches no security field.
#
# What differs on EKS versus the LOCAL overlay:
#
#   1. imagePullPolicy — the base sets none (a locally side-loaded image needs
#      no pull). On EKS the image is pulled from ECR, so an explicit `Always`
#      belongs here (runs exactly the image just pushed for this validation).
#
#   2. Runtime DATASET (M-04 CLOSED). The dataset is retrieved at runtime from a
#      real, Terraform-provisioned, private, CMK-encrypted S3 bucket
#      (terraform/datasets.tf) by the base `fetch-dataset` init container. This
#      overlay supplies only the SOURCE:
#        * DATASET_S3_URI      — a committed PLACEHOLDER (account id 000000000000),
#          filled in for the operator's OWN account WITHOUT editing this file:
#              cd k8s/overlays/aws
#              kustomize edit add configmap ...   # or set the value below from:
#              terraform -chdir=../../../terraform output -raw dataset_s3_uri
#          (equivalently s3://<name_prefix>-datasets-<account>/pima-indians-diabetes/v1/data.csv)
#        * AWS_DEFAULT_REGION  — boto3's region for real S3.
#      What is deliberately ABSENT is the workload-identity design (ADR-027):
#        * NO AWS_S3_ENDPOINT_URL — boto3 talks to real Amazon S3, not MinIO.
#        * NO credential Secret / envFrom — the init container obtains SHORT-LIVED,
#          POD-SCOPED credentials from EKS Pod Identity (the dataset-reader role
#          bound to the mlops/mlops-pipeline service account in terraform/datasets.tf).
#          There are NO static AWS keys on the cluster, and no
#          AWS_ACCESS_KEY_ID/SECRET anywhere. The DATASET_SHA256 integrity pin and
#          the base ConfigMap envFrom are inherited unchanged (this patch adds only
#          `env`, which merges by name and preserves the base envFrom).
#      The former dataset ConfigMap (and its volume/mount) is GONE: the dataset is
#      no longer carried in a ConfigMap, baked into the image, or committed to Git.
#
#   3. MLflow backend — DELIBERATELY NOT patched here (both overlays use the same
#      in-cluster MLflow Service; ADR-026). See mlflow-cloud.yaml for the server's
#      own S3 artifact store.
apiVersion: batch/v1
kind: Job
metadata:
  name: mlops-pipeline
  namespace: mlops
spec:
  template:
    spec:
      initContainers:
        - name: fetch-dataset
          # Pull the ECR image on every run, consistent with the pipeline
          # container below (both are the same image).
          imagePullPolicy: Always
          # SOURCE only — identity (DATASET_SHA256) and LOG_LEVEL come from the base
          # ConfigMap via the inherited envFrom; credentials come from Pod Identity.
          env:
            - name: DATASET_S3_URI
              value: "s3://mlops-pipeline-dev-datasets-000000000000/pima-indians-diabetes/v1/data.csv"
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
      containers:
        - name: pipeline
          # Pull the ECR image on every run (see header rationale).
          imagePullPolicy: Always
