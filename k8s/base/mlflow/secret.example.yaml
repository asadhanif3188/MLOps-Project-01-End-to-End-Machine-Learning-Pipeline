# =============================================================================
# SECRET TEMPLATE — EXAMPLE ONLY. SAFE TO COMMIT. CONTAINS NO REAL CREDENTIALS.
# =============================================================================
#
# This is a *template*, not an applied manifest. It documents the shape of the
# PostgreSQL credential Secret the MLflow platform expects. The values below are
# placeholders — NEVER put real credentials here or commit a filled-in copy.
#
# It is deliberately NOT listed in mlflow/kustomization.yaml, so `kustomize build`
# and `kubectl apply -k` never render or apply it. The real Secret is created
# out-of-band (exactly like the pipeline's former DagsHub Secret), so credentials
# never pass through git or a rendered manifest. Pick a strong password:
#
#   kubectl create secret generic mlflow-db-credentials \
#     --namespace mlops \
#     --from-literal=POSTGRES_USER=mlflow \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 24 | tr -d '/+=')"
#
# Keys — consumed by BOTH the Postgres StatefulSet (to initialise the database)
# and the MLflow Deployment (as PGUSER/PGPASSWORD for its backend-store connection):
#   * POSTGRES_USER     — the database role MLflow connects as.
#   * POSTGRES_PASSWORD — that role's password. Kept out of the connection URI and
#                         out of the process argv (delivered via libpq env), so an
#                         alphanumeric value avoids URL-encoding entirely.
#
# The DATABASE NAME (POSTGRES_DB) is non-secret and lives in the ConfigMap.
#
# Rotation: re-create the Secret (delete + create) and restart the MLflow
# Deployment; the Postgres role password must be changed in lock-step
# (`ALTER ROLE`) since the database persists across the Secret change.
apiVersion: v1
kind: Secret
metadata:
  name: mlflow-db-credentials
  namespace: mlops
  labels:
    app.kubernetes.io/name: mlflow-postgres
    app.kubernetes.io/part-of: mlops-pipeline
    app.kubernetes.io/component: tracking-credentials
type: Opaque
stringData:
  # Placeholders — replace out-of-band (see the header). DO NOT COMMIT REAL VALUES.
  POSTGRES_USER: "REPLACE_WITH_DB_USER"
  POSTGRES_PASSWORD: "REPLACE_WITH_DB_PASSWORD"
