stages:
  preprocess:
    cmd: python src/preprocess.py
    deps:
    - data/raw/data.csv
    - src/preprocess.py
    params:
    - preprocess.input
    - preprocess.output
    outs:
    - data/processed/data.csv

  split:
    cmd: python src/split.py
    deps:
    - data/processed/data.csv
    - src/split.py
    params:
    - split.input
    - split.train_output
    - split.test_output
    - split.target
    - split.test_size
    - split.random_state
    outs:
    - data/processed/train.csv
    - data/processed/test.csv

  train:
    cmd: python src/train.py
    deps:
    - data/processed/train.csv
    - src/train.py
    params:
    - train.input
    - train.max_depth
    - train.n_estimators
    - train.output
    - train.random_state
    - train.target
    outs:
    - models/model.pkl

  evaluate:
    cmd: python src/evaluate.py
    deps:
    - data/processed/test.csv
    - models/model.pkl
    - src/evaluate.py
    params:
    - evaluate.data
    - evaluate.metrics
    - evaluate.model
    - evaluate.target
    metrics:
    - metrics/metrics.json:
        cache: false
