# Grafana — the dashboards layer (Sprint 8, PR 5; ADR-032). Grafana renders the
# three purpose-built dashboards (EKS/Platform Health, MLOps Pipeline Operations,
# MLflow Platform Health) over the Prometheus datasource. Everything is PROVISIONED
# from version-controlled files — the datasource, the dashboard provider, and the
# dashboard JSON all come from ConfigMaps mounted read-only; nothing is clicked in
# a UI and nothing is stored in a database that would drift from git.
#
# INTERNAL-ONLY (ClusterIP; reached via `kubectl port-forward`, never a public
# endpoint) — the same posture as Prometheus and the MLflow UI (ADR-026/ADR-028).
#
# STATELESS BY DESIGN. Grafana's SQLite state lives on an `emptyDir`, not a PVC:
# every dashboard and datasource is provisioned from disk on each start, so there is
# nothing durable worth persisting (org users/API keys are not used on a single-
# operator validation cluster). This keeps Grafana free of a standing EBS cost and a
# teardown step, matching the ephemeral posture of the rest of the stack (ADR-020).
#
# LEAST PRIVILEGE. Grafana never calls the Kubernetes API (it talks only to
# Prometheus over HTTP), so its ServiceAccount mounts no token. It is otherwise fully
# hardened to the monitoring contract: non-root uid 472, drop ALL, no privilege
# escalation, seccomp RuntimeDefault, read-only root filesystem (writable state and
# scratch are dedicated emptyDir volumes). No external network calls: update checks,
# analytics, gravatar and the news feed are all disabled so a probe/render never
# reaches out of the cluster.
#
# ADMIN CREDENTIAL — out-of-band, never committed. The admin password comes ONLY
# from a Secret (see grafana-admin-secret.example.yaml for the template + the exact
# create command). Anonymous access is enabled at the Viewer role so an operator can
# read the dashboards over a port-forward without logging in, while editing/config
# still requires the admin credential.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: mlops-pipeline
    app.kubernetes.io/component: dashboards
    app.kubernetes.io/managed-by: kustomize
# Grafana never talks to the Kubernetes API (only to Prometheus over HTTP), so it
# needs no token — mount off, matching the fleet-wide default and keeping an unused,
# exfiltratable token out of the pod.
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: mlops-pipeline
    app.kubernetes.io/component: dashboards
    app.kubernetes.io/managed-by: kustomize
spec:
  # Single replica: dashboards are stateless (provisioned from disk) and a single-
  # operator validation cluster does not need HA (matches the rest of the stack).
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  # Recreate, not RollingUpdate: a single-replica dashboards tool with no need for a
  # zero-downtime overlap during an upgrade. Recreate also means a provisioning-
  # ConfigMap change (which needs a fresh Grafana process to take effect — see
  # docs/monitoring-operations.md) is picked up cleanly by a `kubectl rollout restart`
  # rather than two generations briefly running the old and new config side by side.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: mlops-pipeline
        app.kubernetes.io/component: dashboards
    spec:
      serviceAccountName: grafana
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The Grafana image runs as uid/gid 472 (grafana); state it numerically so
        # runAsNonRoot admits without name resolution.
        runAsUser: 472
        runAsGroup: 472
        # Own the emptyDir volumes as gid 472 so the non-root process can write them
        # (an emptyDir is created root-owned).
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          # Pinned, non-latest LTS line for a stable dashboards contract.
          image: docker.io/grafana/grafana:11.2.0
          ports:
            - name: http
              containerPort: 3000
          env:
            # Admin identity — sourced ONLY from the out-of-band Secret, never inline
            # (no credential in a manifest or a ConfigMap).
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin-credentials
                  key: admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin-credentials
                  key: admin-password
            # Anonymous read access so dashboards are viewable over a port-forward
            # without a login; editing/admin still needs the credential above.
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Viewer"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            # No outbound calls: disable update checks, usage analytics, gravatar and
            # the news feed so nothing reaches outside the cluster.
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_NEWS_NEWS_FEED_ENABLED
              value: "false"
            - name: GF_SECURITY_DISABLE_GRAVATAR
              value: "true"
            # Log to stdout only (console) so nothing writes to /var/log/grafana —
            # keeps the root filesystem read-only with no extra log volume.
            - name: GF_LOG_MODE
              value: "console"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            # Grafana writes only to its dedicated emptyDir volumes (/var/lib/grafana
            # and /tmp), so the root filesystem is locked read-only — satisfying the
            # monitoring stack's readOnlyRootFilesystem contract (k8s/validate.py M4).
            readOnlyRootFilesystem: true
          # Conservative resources for a handful of provisioned dashboards over one
          # datasource. Requests/limits are mandatory (the monitoring contract);
          # tightened from MEASURED usage in the runtime-evidence PR.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            # Writable state dir (SQLite, plugins) — ephemeral; dashboards/datasource
            # are re-provisioned from the ConfigMaps on each start.
            - name: storage
              mountPath: /var/lib/grafana
            # Writable scratch so the read-only root filesystem does not block /tmp.
            - name: tmp
              mountPath: /tmp
            # Datasource + dashboard-provider provisioning, read from disk at boot.
            - name: provisioning-datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: provisioning-dashboards
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            # The dashboard JSON, mounted where the provider (providers.yaml) looks.
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
      volumes:
        - name: storage
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: provisioning-datasources
          configMap:
            name: grafana-datasources
        - name: provisioning-dashboards
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
---
# Service — the internal Grafana UI endpoint (`http://grafana.monitoring:3000`),
# reached via `kubectl port-forward` (see docs/monitoring-operations.md). ClusterIP:
# internal-only, never a NodePort/LoadBalancer — Grafana is not exposed publicly.
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: mlops-pipeline
    app.kubernetes.io/component: dashboards
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
