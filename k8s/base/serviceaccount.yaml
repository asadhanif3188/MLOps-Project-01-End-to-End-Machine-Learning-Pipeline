# ServiceAccount — an explicit, least-privilege identity for the pipeline Job.
#
# Why an explicit ServiceAccount rather than the namespace `default`: the workload
# gets its own named identity, so any future RBAC, image-pull, or admission policy
# is scoped to *this* workload instead of everything that happens to land in the
# namespace's default account.
#
# automountServiceAccountToken: false — the pipeline does NOT talk to the
# Kubernetes API. It runs `dvc repro` (preprocess → split → train → evaluate) and
# reaches out only to MLflow/DagsHub over HTTPS; it never creates, reads, or
# watches cluster objects. So it needs no API credential, and mounting one would
# be an unused, exfiltratable token in the pod — least privilege says don't mount
# it. Set here as the default for anything using this account, and re-asserted on
# the Job's pod template (job.yaml) so the workload's intent is explicit at both
# layers. No Role/RoleBinding is defined precisely because no API access is
# required (adding RBAC "just in case" would grant standing permissions for
# nothing).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlops-pipeline
  namespace: mlops
  labels:
    app.kubernetes.io/name: mlops-pipeline
    app.kubernetes.io/part-of: mlops-pipeline
    app.kubernetes.io/component: identity
    app.kubernetes.io/managed-by: kustomize
automountServiceAccountToken: false
